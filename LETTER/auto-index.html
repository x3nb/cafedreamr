<!-- ============================================================
     the cafe's letter — the wrapper
     ------------------------------------------------------------
     the letter is written by the house itself, which means it can
     only be written where the words are: the generator behind the
     terminal. this page is just the envelope — it opens that same
     page with #letter, which skips the machine entirely and leaves
     nothing on screen but the sheet.

     >>> if the generator is ever renamed, change the name in the
         iframe src and in #rawLink below (and nowhere else).
     ============================================================ -->
<style>
  :root{
    --ink:#0b0b0e;--ink2:#141419;--cream:#f4f0e5;--lav:#fff0f5;--dim:#8b83a0;
    --lime:#ccff00;--violet:#bf40bf;--pink:#ff2d95;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--ink);color:var(--lav);font-family:var(--mono);
    display:flex;flex-direction:column;overflow:hidden}
  body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(90% 60% at 50% 0%,rgba(191,64,191,.18),transparent 62%)}
  .bar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.09);
    background:rgba(11,11,14,.86);backdrop-filter:blur(6px)}
  .bar .tag{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar a{font-size:9px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;
    color:var(--lav);border:1px solid rgba(255,255,255,.14);border-radius:999px;
    padding:7px 12px;white-space:nowrap;transition:.18s}
  .bar a:hover{border-color:var(--lime);color:var(--lime)}
  .bar .spacer{flex:1;min-width:0}
  .bar a.raw{color:var(--dim)}
  .bar a.raw:hover{border-color:var(--violet);color:var(--violet)}
  .sheetWrap{position:relative;z-index:1;flex:1;min-height:0}
  iframe{display:block;width:100%;height:100%;border:0;background:transparent}
  .sorry{position:relative;z-index:2;padding:9px 14px;border-top:1px solid rgba(255,255,255,.09);
    font-size:9.5px;line-height:1.7;letter-spacing:.06em;color:var(--dim);background:rgba(11,11,14,.86)}
  .sorry a{color:var(--lav);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.2)}
  .sorry a:hover{color:var(--lime);border-color:var(--lime)}
  @media (max-width:560px){
    .bar .tag{display:none}
    .bar a{padding:7px 10px;letter-spacing:.12em}
  }
</style>
</head>
<body>

<div class="bar">
  <a href="https://www.cafedreamr.art/">&larr; the terminal</a>
  <span class="spacer"></span>
  <span class="tag">the cafe's letter &middot; written by the house</span>
  <span class="spacer"></span>
  <a class="raw" id="rawLink" href="https://perchance.org/keep-bookmarked#letter" target="_blank" rel="noopener">own tab &rarr;</a>
</div>

<div class="sheetWrap">
  <iframe id="sheet" title="the cafe's letter"
    src="https://null.perchance.org/keep-bookmarked#letter"
    allow="clipboard-write; fullscreen"
    referrerpolicy="no-referrer"></iframe>
</div>

<p class="sorry">the sheet is written by the house whenever you open it, so it takes a moment, and it is different every time &mdash; that is the whole idea. if the sheet stays blank, <a href="https://perchance.org/keep-bookmarked#letter" target="_blank" rel="noopener">open it in its own tab</a>.</p>

<noscript><p class="sorry">this page hands the letter over to the house, and that needs javascript. you can also read the zine instead: <a href="https://www.cafedreamr.art/MIKI/ZINE/">the rack</a>.</p></noscript>

</body>
</html>
