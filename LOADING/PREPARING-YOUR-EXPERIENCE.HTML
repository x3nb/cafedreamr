<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading | Chimera Cafe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .loader-container {
            position: relative;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        /* Image Container */
        .banner-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .banner-image {
            width: 100%;
            display: block;
            /* Subtle zoom animation */
            animation: breathe 5s infinite alternate ease-in-out;
        }

        /* Loading Bar */
        .progress-container {
            margin-top: 25px;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #d4a373, #faedcd);
            box-shadow: 0 0 15px rgba(212, 163, 115, 0.6);
            animation: fillProgress 3s infinite ease-in-out;
        }

        .status-text {
            color: #fff;
            margin-top: 15px;
            letter-spacing: 3px;
            font-size: 0.8rem;
            text-transform: uppercase;
            opacity: 0.7;
            animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes fillProgress {
            0% { width: 0%; left: 0; }
            50% { width: 100%; }
            100% { width: 100%; opacity: 0; }
        }

        @keyframes breathe {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="banner-wrapper">
            <img src="chineracafe-banner-cool.jpg" alt="Chinera Cafe Banner" class="banner-image">
        </div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <div class="status-text">Preparing your experience...</div>
    </div>
<script>
    setTimeout(function() {
        window.location.href = "https://xenbohem.github.io/storyboard/movie/watchme.html"; // Replace with your actual home page
    }, 4000); // 4 seconds
</script>
</body>
</html>
