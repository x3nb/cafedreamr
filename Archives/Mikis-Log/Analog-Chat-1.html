<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miki's Core Log | Chimera Collective</title>
    <style>
        /* --- MIKI'S THEME (Cooler, Digital Vibe) --- */
        :root {
            --accent: #00d4ff; /* Miki's digital blue */
            --bg: #050505;
            --panel: #111;
            --text: #e0f7fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            height: 100%; 
            background-color: var(--bg); 
            color: var(--text);
            font-family: 'Courier New', Courier, monospace; /* Miki's coder font */
            overflow: hidden;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 450px; /* Video on left, Padlet on right */
            height: 100vh;
        }

        /* --- LEFT SIDE: THE TERMINAL --- */
        .experience-side {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 1px solid var(--accent);
        }

        .banner-frame {
            width: 100%;
            height: 180px;
            overflow: hidden;
            border-bottom: 2px solid var(--accent);
        }

        .banner-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(0.5) cyan(0.2); /* Miki's tech filter */
        }

        .media-viewport {
            flex-grow: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, #0a0a0a 0%, #000 100%);
        }

        .visual-frame {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            border: 1px solid var(--accent);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            margin-bottom: 20px;
        }

        /* --- MIKI'S CORE LOG (Search) --- */
        .log-section {
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .log-header h2 { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }
        
        .search-area { display: flex; gap: 10px; margin: 20px 0; }
        
        #coreSearch {
            flex-grow: 1;
            background: #000;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px;
            outline: none;
        }

        .access-btn {
            background: var(--accent);
            color: black;
            border: none;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .log-entry {
            background: #111;
            padding: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            min-height: 100px;
        }

        /* --- RIGHT SIDE: THE PADLET --- */
        .padlet-sidebar {
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--accent);
        }

        .padlet-header {
            padding: 10px;
            background: var(--accent);
            color: black;
            font-weight: bold;
            text-align: center;
            font-size: 0.8rem;
        }

    </style>
</head>
<body>

    <div class="main-grid">
        
        <div class="experience-side">
            <div class="banner-frame">
                <img src="https://xencafe.nekoweb.org/2026-LIVESTREAM/MIKIS-REALM-ARTPOST/MikiPeeringManically.jpeg" class="banner-image">
            </div>

            <div class="media-viewport">
                <div class="visual-frame">
                    <video autoplay muted loop>
                        <source src="miki-tech-visuals.mp4" type="video/mp4">
                    </video>
                </div>
                
                <div class="log-section">
                    <div class="log-header">
                        <h2>> CORE_LOG v1.0</h2>
                        <p style="color: #666;">Authorized Access Only - User: Miki</p>
                    </div>

                    <div class="search-area">
                        <input type="text" id="coreSearch" placeholder="Enter query (e.g. Hans, Chari, Core)...">
                        <button class="access-btn" onclick="queryMiki()">ACCESS</button>
                    </div>

                    <div id="logResult" class="log-entry">
                        [Waiting for input...]
                    </div>
                </div>
            </div>
        </div>

        <div class="padlet-sidebar">
            <div class="padlet-header">LIVE CORE LOG FEED</div>
            <iframe 
                src="https://padlet.com/embed/hbu3ozs9k8tqlhuy" 
                frameborder="0" 
                allow="camera;microphone;geolocation" 
                style="width:100%;height:100%;background:#fff;">
            </iframe>
        </div>

    </div>

    <script>
        const mikiLore = [
            { key: "hans", msg: "[ENTRY 04]: Hans is complaining about the data-cabling again. Says it interferes with the 'ambient resonance' of the tea. I told him to stick to Oolong and leave the fiber-optics to me." },
            { key: "chari", msg: "[ENTRY 09]: Caught Chari trying to 'hack' the espresso machine for more pressure. I've locked the firmware. We don't need a steam-powered explosion today." },
            { key: "core", msg: "[SYSTEM]: The Core Log is the heartbeat of the Chimera Collective. All sightings, card matches, and lore anomalies are recorded here for posterity." }
        ];

        function queryMiki() {
            const val = document.getElementById('coreSearch').value.toLowerCase();
            const res = document.getElementById('logResult');
            const match = mikiLore.find(e => val.includes(e.key));
            
            if(match) {
                res.innerHTML = `<span style="color:var(--accent)">MATCH FOUND:</span><br><br>${match.msg}`;
            } else {
                res.innerHTML = `<span style="color:red">ERROR:</span> No record found in Core Log for '${val}'.`;
            }
        }
    </script>

</body>
</html>
