<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d001a">
<title>hans&rsquo; mystery grid &middot; cafedreamr</title>
<meta name="description" content="Thirty-six sealed portals, catalogued by Hans. Find the four tea-time clues and the grid opens.">
<meta property="og:title" content="hans&rsquo; mystery grid &middot; cafedreamr">
<meta property="og:description" content="Thirty-six sealed portals. Four hidden clues. One sealed door.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://user.uploads.dev/file/c9b2b6aecf4e03e1aaf4b25ea176cf07.jpg">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d001a'/%3E%3Ccircle cx='8' cy='8' r='5.4' fill='none' stroke='%239d71e4' stroke-width='1.1' stroke-dasharray='1.6 2'/%3E%3Ccircle cx='8' cy='8' r='2.6' fill='none' stroke='%23c0a6ff' stroke-width='1'/%3E%3Ccircle cx='8' cy='8' r='1' fill='%23ccff00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Klee+One:wght@400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Vampiro+One&display=swap" rel="stylesheet">
<style>
/* ============================================================
   hans' mystery grid — cafedreamr
   a 36-portal cyber gallery, purple-led, in the vendi house
   style. the tile art is generated (a unique sigil per portal)
   so the page never shows a broken image; drop real pictures
   into images/ and the `thumbnails` map below will use them.

   EDIT SURFACE (all in the <script> at the bottom of <body>):
     thumbnails — image paths (images/*.png)
     actions    — the 36 portals, in order
     tileImages — which portal uses which image
     DISPLAY    — name / accent colour / flavour text per portal
     clueIds    — the four clue portals
   ============================================================ */
:root{
  --plum:#0d001a; --plum2:#1a002e; --plum3:#12001f;
  --ink:#0b0b0e; --ink2:#141419; --ink3:#1b1b22;
  --lime:#ccff00; --pink:#ff2d95; --cyan:#00e5ff;
  --violet:#bf40bf; --violet2:#ee82ee; --purple:#9d71e4;
  --purple2:#c0a6ff; --grape:#5b1a96;
  --corn:#6495ed; --mint:#98fb98;
  --cream:#e9e6de; --lav:#fff0f5; --dim:#8b83a0;
  --line:rgba(255,255,255,.10);
  --pline:rgba(157,113,228,.32);
  --glow:0 0 12px rgba(157,113,228,.6), 0 0 36px rgba(157,113,228,.25);
  --mono:'Space Mono', ui-monospace, monospace;
  --disp:'Bebas Neue', impact, sans-serif;
  --logo:'Vampiro One', cursive;
  --body:'Klee One', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plum); color:var(--lav); font-family:var(--body);
  text-align:left; min-height:100vh; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}

/* ---------------- background ---------------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(1100px 720px at 50% -14%, rgba(157,113,228,.22), transparent 62%),
    radial-gradient(820px 640px at 84% 108%, rgba(255,45,149,.11), transparent 62%),
    radial-gradient(760px 620px at 8% 92%, rgba(0,229,255,.09), transparent 62%),
    linear-gradient(180deg,#170029 0%, var(--plum) 48%, #07000f 100%)}
#stars{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.8}
.floor{position:absolute;left:-25%;right:-25%;bottom:-4%;height:46%;
  background:
    repeating-linear-gradient(90deg, rgba(157,113,228,.20) 0 1px, transparent 1px 6%),
    repeating-linear-gradient(0deg, rgba(157,113,228,.20) 0 1px, transparent 1px 32px);
  transform:perspective(360px) rotateX(73deg); transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(180deg,transparent, #000 62%);
  mask-image:linear-gradient(180deg,transparent, #000 62%); opacity:.6;
  animation:floor 7s linear infinite}
@keyframes floor{to{background-position:0 32px, 0 32px}}
.band{position:absolute;left:0;right:0;height:190px;top:-200px;
  background:linear-gradient(180deg,transparent, rgba(192,166,255,.07), transparent);
  animation:band 11s linear infinite}
@keyframes band{to{top:100%}}
.vign{position:absolute;inset:0;background:
  radial-gradient(150% 120% at 50% 42%, transparent 34%, rgba(4,0,10,.78) 100%)}
.scan{position:absolute;inset:0;opacity:.3;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px)}
.grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
  background-size:3px 3px}

.stage{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:22px 16px 40px}

/* ---------------- marquee ---------------- */
.marquee{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  border:1px solid var(--pline);border-radius:16px 16px 6px 6px;
  background:linear-gradient(180deg,rgba(157,113,228,.14),rgba(157,113,228,.03));
  padding:13px 16px;position:relative;overflow:hidden}
.marquee:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--purple),var(--cyan),var(--pink));opacity:.85}
.marquee:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(90deg, rgba(157,113,228,.10) 0 1px, transparent 1px 26px)}
.mtitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0;position:relative;z-index:1}
.brand{font-family:var(--logo);font-size:28px;letter-spacing:.05em;color:var(--purple2);
  white-space:nowrap;line-height:1.1;
  text-shadow:0 0 12px rgba(157,113,228,.75), 0 0 38px rgba(157,113,228,.3),
              2px 0 0 rgba(255,45,149,.4), -2px 0 0 rgba(0,229,255,.32);
  animation:flick 9s ease-in-out infinite}
@keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.66}95.5%{opacity:.95}97%{opacity:.8}}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap}
.led{width:8px;height:8px;border-radius:50%;background:var(--violet2);
  box-shadow:0 0 12px var(--violet2);animation:blip 2.2s ease-in-out infinite;align-self:center}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
.mact{display:flex;gap:8px;position:relative;z-index:1;flex-wrap:wrap}
.back{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--lav);text-decoration:none;border:1px solid var(--pline);border-radius:999px;
  padding:8px 12px;white-space:nowrap;transition:.18s;background:rgba(13,0,26,.5);display:inline-block}
.back:hover,.back:focus-visible{border-color:var(--purple2);color:var(--purple2);
  box-shadow:0 0 16px rgba(192,166,255,.3);outline:none}

/* ---------------- hud ---------------- */
.hud{margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:8px 12px;
  background:linear-gradient(180deg,rgba(18,0,31,.9),rgba(11,0,20,.75))}
.boot{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mint);min-width:0;
  display:flex;align-items:center;gap:7px;flex:1 1 260px}
.boot .pr{color:var(--pink)}
.boot #bootTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur{display:inline-block;width:6px;height:11px;background:var(--mint);vertical-align:-1px;
  animation:blink 1s steps(1) infinite;flex:0 0 auto}
@keyframes blink{50%{opacity:0}}
.meters{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.meter{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.meter b{color:var(--purple2);font-weight:700}
.meter.clues b{color:var(--pink)}
.meter.done{border-color:rgba(204,255,0,.55)}
.meter.done b{color:var(--lime)}
.meter.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.mini{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:5px 10px;cursor:pointer;transition:.16s}
.mini:hover,.mini:focus-visible{color:var(--pink);border-color:rgba(255,45,149,.5);outline:none}

/* ---------------- board ---------------- */
.board{position:relative;margin-top:12px;border:1px solid var(--pline);border-radius:12px;
  padding:11px;overflow:hidden;
  background:linear-gradient(180deg,rgba(157,113,228,.07),rgba(11,0,20,.55));
  box-shadow:inset 0 0 70px rgba(0,0,0,.55), 0 0 30px rgba(157,113,228,.10)}
.boardbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-family:var(--mono);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  padding:0 3px 9px}
.boardbar b{color:var(--purple2);font-weight:700}
.boardbar .sd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);
  box-shadow:0 0 8px var(--lime);margin:0 2px -1px 3px;animation:blip 1.8s ease-in-out infinite}
.sweep{position:absolute;left:-10%;right:-10%;height:150px;top:-160px;pointer-events:none;z-index:6;
  background:linear-gradient(180deg,transparent, rgba(192,166,255,.075), transparent);
  animation:band 8.5s linear infinite}
.brk{position:absolute;width:14px;height:14px;pointer-events:none;z-index:7;opacity:.6}
.brk:before,.brk:after{content:"";position:absolute;background:var(--purple)}
.brk:before{width:100%;height:1px} .brk:after{height:100%;width:1px}
.brk.tl{top:5px;left:5px} .brk.tr{top:5px;right:5px;transform:scaleX(-1)}
.brk.bl{bottom:5px;left:5px;transform:scaleY(-1)} .brk.br{bottom:5px;right:5px;transform:scale(-1)}

/* ---------------- gallery ---------------- */
.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;position:relative;z-index:2}
.tile{position:relative;aspect-ratio:1/1;padding:0;margin:0;cursor:pointer;
  border:1px solid rgba(157,113,228,.30);border-radius:9px;overflow:hidden;
  background:#0b0014;font:inherit;color:inherit;display:block;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  -webkit-tap-highlight-color:transparent}
.tile:hover,.tile:focus-visible{transform:translateY(-3px) scale(1.035);
  border-color:var(--gc,var(--purple2));outline:none;z-index:3;
  box-shadow:0 14px 30px -14px #000, 0 0 24px -5px var(--gc,var(--purple2))}
.tile:active{transform:translateY(-1px) scale(.99)}
.art{position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(115% 115% at 32% 16%, hsl(var(--h) 88% 58% / .32), transparent 62%),
    conic-gradient(from 215deg at 50% 55%, hsl(var(--h) 68% 25%), hsl(calc(var(--h) + 26) 78% 11%), hsl(var(--h) 66% 23%)),
    linear-gradient(180deg,#180029,#0a0013)}
.art .sig{position:absolute;inset:0;width:100%;height:100%;display:block;color:var(--gc,#c0a6ff)}
.art .sig .rot,.art .sig .rot2{transform-box:fill-box;transform-origin:center}
.art .sig .rot{animation:spinA 26s linear infinite}
.art .sig .rot2{animation:spinB 17s linear infinite}
@keyframes spinA{to{transform:rotate(360deg)}}
@keyframes spinB{to{transform:rotate(-360deg)}}
.art .sig .ring{fill:none;stroke:currentColor;stroke-opacity:.32;stroke-width:.9;stroke-dasharray:2 4}
.art .sig .p1{fill:currentColor;fill-opacity:.10;stroke:currentColor;stroke-opacity:.85;stroke-width:1.1}
.art .sig .p2{fill:none;stroke:currentColor;stroke-opacity:.5;stroke-width:.85}
.art .sig line{stroke:currentColor;stroke-opacity:.38;stroke-width:.8}
.art .sig .halo{fill:none;stroke:currentColor;stroke-opacity:.32;stroke-width:.6}
.art .sig .core{fill:currentColor}
.shot{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .45s ease;filter:saturate(1.06) contrast(1.04) brightness(.92)}
.shot.on{opacity:1}
.tint{position:absolute;inset:0;z-index:3;opacity:.42;transition:opacity .45s ease;pointer-events:none;
  background:linear-gradient(180deg, rgba(26,0,46,.30), rgba(11,0,20,.66) 80%)}
.tile.hasimg .tint{opacity:1}
.scanl{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.34;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.42) 0 1px, transparent 1px 3px)}
.sheen{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .25s ease;
  background:linear-gradient(115deg, rgba(255,255,255,.16) 0%, transparent 40%, transparent 62%, rgba(192,166,255,.16) 100%)}
.tile:hover .sheen,.tile:focus-visible .sheen{opacity:1}
.idx{position:absolute;top:5px;left:7px;z-index:6;font-family:var(--mono);font-size:8px;
  letter-spacing:.1em;color:rgba(255,240,245,.45)}
.tile.seen .idx:before{content:"\2713\00a0";color:var(--mint)}
.tagx{position:absolute;top:4px;right:5px;z-index:6;width:16px;height:16px;border-radius:5px;
  display:grid;place-items:center;font-family:var(--mono);font-size:9px;line-height:1}
.tagx.clue{color:var(--pink);border:1px solid rgba(255,45,149,.5);background:rgba(255,45,149,.14);
  animation:blip 2s ease-in-out infinite}
.tile.found .tagx.clue{color:var(--lime);border-color:rgba(204,255,0,.6);
  background:rgba(204,255,0,.14);animation:none}
.tagx.lock{color:var(--pink);border:1px solid rgba(255,45,149,.45);background:rgba(255,45,149,.10)}
.tile.unlocked .tagx.lock{color:var(--lime);border-color:rgba(204,255,0,.6);
  background:rgba(204,255,0,.14)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:6px 7px 5px;
  font-family:var(--mono);font-size:8px;letter-spacing:.11em;text-transform:uppercase;
  color:rgba(240,235,255,.74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 4px #000;text-align:left}
.cap:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;opacity:0;transition:.2s;
  background:linear-gradient(90deg,transparent,var(--gc,var(--purple2)),transparent)}
.tile:hover .cap:before,.tile:focus-visible .cap:before{opacity:1}
.tile.sealed{filter:saturate(.45) brightness(.72)}
.tile.unlocked{border-color:rgba(204,255,0,.6);animation:unlock 2.2s ease-in-out infinite}
@keyframes unlock{0%,100%{box-shadow:0 0 0 0 rgba(204,255,0,.36)}
  50%{box-shadow:0 0 22px 2px rgba(204,255,0,.42)}}
.tile.glitching{animation:glitch .13s infinite}
@keyframes glitch{
  0%{transform:translate(0);filter:none}
  20%{transform:translate(-4px,3px);filter:hue-rotate(28deg) saturate(1.5)}
  40%{transform:translate(5px,-2px);filter:hue-rotate(-24deg) contrast(1.3)}
  60%{transform:translate(-3px,1px)}
  80%{transform:translate(2px,-3px);filter:hue-rotate(16deg)}
  100%{transform:translate(0);filter:none}}
.tile.morphing .art{filter:blur(9px) saturate(1.7);transition:filter .7s ease}
.tile.flash{animation:pop .8s ease}

/* ---------------- footer ---------------- */
.foot{margin-top:16px;font-family:var(--mono);font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);text-align:center;opacity:.85;line-height:2}
.foot em{color:var(--pink);font-style:normal}
.foot a{color:var(--lav);text-decoration:none;border-bottom:1px solid var(--line)}
.foot a:hover{color:var(--purple2);border-color:var(--purple2)}

/* ---------------- popup ---------------- */
.popup{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(6,0,12,.78);backdrop-filter:blur(7px)}
.popup.active{display:flex}
.pcard{position:relative;width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;
  border:1px solid var(--accent,var(--purple));border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#1a0b2c,#0c0018);
  box-shadow:0 26px 80px rgba(0,0,0,.85), 0 0 44px -14px var(--accent,var(--purple));
  animation:pin .24s ease both}
@keyframes pin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.pcard:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--accent,var(--purple)),transparent)}
.pbar{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line);
  background:rgba(11,0,20,.5);flex:0 0 auto}
.pglyph{width:22px;height:22px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;color:var(--accent,var(--purple2));
  border:1px solid var(--accent,var(--purple2));background:rgba(255,255,255,.03)}
.ptitle{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent,var(--purple2));flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.px{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
  background:rgba(11,0,20,.7);color:var(--lav);font-family:var(--mono);font-size:12px;line-height:1;
  cursor:pointer;transition:.18s;padding:0}
.px:hover,.px:focus-visible{border-color:var(--pink);color:var(--pink);outline:none}
.pbody{padding:15px;overflow:auto;overscroll-behavior:contain}
.dtext{margin:0 0 11px;font-size:13.5px;line-height:1.65;color:#e4dff0}
.dtext:last-child{margin-bottom:0}
.dtext.ok{color:var(--lime)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--lav);background:rgba(157,113,228,.10);border:1px solid rgba(157,113,228,.55);
  border-radius:999px;padding:9px 14px;cursor:pointer;transition:.16s;text-decoration:none;
  display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.chip:hover,.chip:focus-visible{border-color:var(--lime);color:var(--lime);
  box-shadow:0 0 16px rgba(204,255,0,.22);outline:none}
.chip.tag{pointer-events:none;cursor:default;padding:6px 11px;font-size:8.5px}
.chip.tag.pink{color:var(--pink);border-color:rgba(255,45,149,.55);background:rgba(255,45,149,.10)}
.chip.tag.lime{color:var(--lime);border-color:rgba(204,255,0,.55);background:rgba(204,255,0,.08)}
.chip.tag.dim{color:var(--dim);border-color:var(--line);background:transparent}
.metarow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:2px;display:block;
  background:transparent;border:1px solid rgba(255,45,149,.55);transform:rotate(45deg)}
.dots i.on{background:var(--lime);border-color:var(--lime);box-shadow:0 0 9px rgba(204,255,0,.55)}
.speaker{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.pfp{position:relative;width:54px;height:54px;flex:0 0 auto;border-radius:12px;overflow:hidden;
  border:1px solid var(--accent,var(--purple2));background:#0b0014;
  box-shadow:0 0 18px -5px var(--accent,var(--purple2)), inset 0 0 20px rgba(0,0,0,.7)}
.pfp .sig{position:absolute;inset:0;width:100%;height:100%;display:block;color:var(--accent,var(--purple2))}
.pfp .sig .rot,.pfp .sig .rot2{transform-box:fill-box;transform-origin:center}
.pfp .sig .rot{animation:spinA 30s linear infinite}
.pfp .sig .ring{fill:none;stroke:currentColor;stroke-opacity:.35;stroke-width:.9;stroke-dasharray:2 4}
.pfp .sig .p1{fill:currentColor;fill-opacity:.10;stroke:currentColor;stroke-opacity:.85;stroke-width:1.1}
.pfp .sig .p2{fill:none;stroke:currentColor;stroke-opacity:.5;stroke-width:.85}
.pfp .sig .halo{fill:none;stroke:currentColor;stroke-opacity:.32;stroke-width:.6}
.pfp .sig .core{fill:currentColor}
.pfp img{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .45s ease;filter:saturate(1.05) contrast(1.03)}
.pfp img.on{opacity:1}
.who b{display:block;font-family:var(--disp);font-size:20px;letter-spacing:.12em;line-height:1;
  color:var(--accent,var(--purple2))}
.who em{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);font-style:normal;margin-top:3px}

/* ---------------- responsive ---------------- */
@media (max-width:1080px){ .gallery{grid-template-columns:repeat(5,1fr)} }
@media (max-width:880px){
  .gallery{grid-template-columns:repeat(4,1fr)}

  <div class="floor"></div>
  <div class="band"></div>
  <div class="vign"></div>
  <div class="scan"></div>
  <div class="grain"></div>
</div>

<main class="stage">

  <header class="marquee">
    <div class="mtitle">
      <span class="brand">hans&rsquo; mystery grid</span>
      <span class="tag">cafedreamr &middot; sheet 01b</span>
      <span class="led"></span>
    </div>
    <div class="mact">
      <a class="back" href="https://www.cafedreamr.art/LORE/MAP.html">&larr; the realm map</a>
    </div>
  </header>

  <div class="hud">
    <div class="boot"><span class="pr">&gt;</span><span id="bootTxt"></span><i class="cur"></i></div>
    <div class="meters">
      <span class="meter clues" id="clueMeter">clues <b id="clueCount">0/4</b></span>
      <span class="meter" id="openMeter">portals <b id="openCount">0/36</b></span>
      <button class="mini" id="resetBtn" type="button">reset trail</button>

  </div>

  <section class="board">
    <span class="brk tl"></span><span class="brk tr"></span>
    <span class="brk bl"></span><span class="brk br"></span>

      <span>grid <b>06 &times; 06</b></span>
      <span>surveyed by <b>hans</b> &middot; rev 02</span>
      <span>signal<i class="sd"></i><b>live</b></span>
    </div>

    <div class="gallery" id="gallery"></div>
  </section>

  <div class="foot">
    thirty-six sealed portals &middot; four clues &middot; one door<br>
    &copy; cafedreamr &middot; <a href="https://www.cafedreamr.art/LORE/OCS/CARDS-SOUNDS/cards.html">the collective, in dossiers</a> &middot; <a href="https://www.cafedreamr.art/">the terminal</a>
  </div>
</main>

<div class="popup" id="genericPopup" role="dialog" aria-modal="true" aria-label="portal output">
  <div class="pcard" id="pcard">
    <div class="pbar">
      <span class="pglyph" id="pGlyph">&#9670;</span>
      <span class="ptitle" id="pTitle">portal output</span>
      <span class="pmeta" id="pMeta"></span>
      <button class="px" id="px" type="button" aria-label="close">&times;</button>
    </div>
    <div class="pbody" id="popupBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =============================================================== */
  /*                 NAMED THUMBNAIL IMAGE MAP                       */
  /* =============================================================== */
  /* drop your own files into images/ and they'll appear on the tile.
     anything missing falls back to the generated sigil art below.   */

  var thumbnails = {
    star: "images/star.png",
    hans: "images/hans.png",
    cafeExterior: "images/cafe-exterior.png",
    cafeInterior: "images/cafe-interior.png",
    loreRoom: "images/lore-room.png",
    elevator: "images/elevator.png",
    hallway: "images/hallway.png",
    clue1: "images/clue1.png",
    clue2: "images/clue2.png",
    clue3: "images/clue3.png",
    clue4: "images/clue4.png",

    chimeraRoom: "images/chimera-room.png",
    library: "images/library.png",
    portal: "images/portal.png",
    starPortrait: "images/star-portrait.png",
    hansPortrait: "images/hans-portrait.png",

    "default": "images/default-placeholder.png"
  };

  /* =============================================================== */
  /*                      TILE ACTION MAP                            */
  /* =============================================================== */

  var actions = [
    "cafeExterior", "cafeInterior", "hans_clue1", "portalView", "music", "star",
    "hans_clue2", "guest", "hans", "loreRoom",
    "glitch", "morph", "menu", "elevator", "hans_clue3", "anchor",
    "academy", "warp", "rift", "chatbot",
    "youtube", "secret", "void", "ascend", "guest2", "forum",
    "social", "anchor2", "portalTwo", "hans_clue4",
    "library", "chimeraRoom", "portalThree", "music2",
    "mikisRealm", "spideyDeck"
  ];

  /* =============================================================== */
  /*                     IMAGE ASSIGNMENT MAP                        */
  /* =============================================================== */

  var tileImages = {
    star: thumbnails.star,
    hans: thumbnails.hans,
    hans_clue1: thumbnails.clue1,
    hans_clue2: thumbnails.clue2,
    hans_clue3: thumbnails.clue3,
    hans_clue4: thumbnails.clue4,

    cafeExterior: thumbnails.cafeExterior,
    cafeInterior: thumbnails.cafeInterior,
    loreRoom: thumbnails.loreRoom,
    elevator: thumbnails.elevator,
    mikisRealm: thumbnails.hallway,

    library: thumbnails.library,
    chimeraRoom: thumbnails.chimeraRoom,
    portalView: thumbnails.portal,
    portalTwo: thumbnails.portal,
    portalThree: thumbnails.portal,

    "default": thumbnails["default"]
  };

  /* =============================================================== */
  /*                    DISPLAY TABLE (per portal)                   */
  /* =============================================================== */

  var DISPLAY = {
    cafeExterior:{ label:"the cafe \u00b7 outside", glyph:"\u25c6", accent:"#ccff00",
      line:"The caf\u00e9 stands quiet under deep-purple night. The sign is doing its best." },
    cafeInterior:{ label:"the cafe \u00b7 inside", glyph:"\u25c8", accent:"#ffb8d9",
      line:"Warm lights. Books. Purring. Sanctuary." },
    portalView:{ label:"portal i", glyph:"\u2726", accent:"#ee82ee",
      line:"A shimmering portal pulses gently." },
    music:{ label:"the jukebox", glyph:"\u266b", accent:"#00e5ff",
      line:"The jukebox is playing something you almost recognise." },
    star:{ label:"star \u00b7 owner", glyph:"\u2726", accent:"#c0a6ff",
      line:"Star keeps the house's books and its bearings. She'll want to know what you're looking for." },
    guest:{ label:"a guest", glyph:"\u25cb", accent:"#98fb98",
      line:"A guest sits by the window with a drink they didn't order. They wave." },
    hans:{ label:"hans \u00b7 historian", glyph:"\u25c8", accent:"#6495ed",
      line:"Hans is cataloguing something. He has opinions about how you pronounce it." },
    loreRoom:{ label:"the lore room", glyph:"\u2727", accent:"#ee82ee",
      line:"Shelves of old lore and glowing sigils." },
    glitch:{ label:"glitch", glyph:"\u2318", accent:"#00e5ff", line:"" },
    morph:{ label:"morph", glyph:"\u21c6", accent:"#00e5ff", line:"" },
    menu:{ label:"the menu", glyph:"\u2630", accent:"#ccff00",
      line:"Tonight: three kinds of tea, one kind of cake, and something crossed out in ink." },
    elevator:{ label:"the elevator", glyph:"\u25b2", accent:"#bf40bf",
      line:"A violet-lit elevator hums softly." },
    anchor:{ label:"anchor i", glyph:"\u2693", accent:"#6495ed",
      line:"An anchor point holds this stretch of the grid in place." },
    academy:{ label:"the academy", glyph:"\u25a3", accent:"#c0a6ff",
      line:"Desks, chalk dust, and a syllabus with teeth. The academy is taking students." },
    warp:{ label:"warp gate", glyph:"\u25bc", accent:"#00e5ff",
      line:"A warp gate, folded shut for now." },
    rift:{ label:"the rift", glyph:"\u2716", accent:"#bf40bf",
      line:"A hairline rift. Best not to lean on it." },
    chatbot:{ label:"the chatbot", glyph:"\u2317", accent:"#98fb98",
      line:"A small chatbot waits patiently to be asked something difficult." },
    youtube:{ label:"the youtube gate", glyph:"\u25b6", accent:"#ff2d95",
      line:"A doorway built entirely out of video. It leads somewhere loud and warm.",
      href:"https://www.youtube.com/@cafedreamer", hrefLabel:"open the channel \u2192" },
    secret:{ label:"sealed", glyph:"\u25a0", accent:"#ccff00", line:"" },
    "void":{ label:"the void", glyph:"\u25cc", accent:"#8b83a0",
      line:"Nothing here but the hum of the void. Reassuring, if you're into that." },
    ascend:{ label:"ascend", glyph:"\u25b2", accent:"#fff0f5",
      line:"Stairs going up, into more stairs." },
    guest2:{ label:"another guest", glyph:"\u25cf", accent:"#98fb98",
      line:"Another guest. Same table, different night. They nod like they've been expecting you." },
    forum:{ label:"the forum", glyph:"\u2709", accent:"#6495ed",
      line:"A forum, mostly quiet, mostly polite, occasionally on fire." },
    social:{ label:"social", glyph:"\u2318", accent:"#ff2d95",
      line:"A doorway with too many name tags pinned to it." },
    anchor2:{ label:"anchor ii", glyph:"\u2693", accent:"#6495ed",
      line:"A second anchor. Someone has been reinforcing the corners." },
    portalTwo:{ label:"portal ii", glyph:"\u2726", accent:"#ee82ee",
      line:"The second portal pulses in a slightly different key." },
    library:{ label:"the library", glyph:"\u25a4", accent:"#c0a6ff",
      line:"The library \u2014 every question ever asked, filed by a weaver of light." },
    chimeraRoom:{ label:"the chimera room", glyph:"\u2727", accent:"#ee82ee",
      line:"The chimera room. It smells like rain and old paper." },
    portalThree:{ label:"portal iii", glyph:"\u2726", accent:"#ee82ee",
      line:"The third portal is warm to the touch. It remembers something." },
    music2:{ label:"the jukebox \u00b7 b-side", glyph:"\u266b", accent:"#00e5ff",
      line:"The jukebox flips itself to the b-side without being asked." },
    mikisRealm:{ label:"miki's realm", glyph:"\u25c8", accent:"#00e5ff",
      line:"One last door, and it opens wide. Miki's realm runs on neon and gentle static \u2014 sprites drift past like slow fireflies, and the music never quite settles. There's a quiet corner here, and the tea is black. Stay as long as you like.",
      href:"https://mikineko.art/MIKIMAIL/SPRITE-APP/index.html", hrefLabel:"step into the sprite app \u2192",
      links:[{ label:"the geisha caf\u00e9 \u2192", href:"https://xencafe.nekoweb.org/0000GEISHA-CAFE/geisha1.html" }] },
    spideyDeck:{ label:"spidey's deck", glyph:"\u266b", accent:"#ff2d95",
      line:"Spidey's deck, where the whole web is one long turntable. Loud in the friendliest way, warm as a window seat \u2014 lean back, say nothing, and let the records keep you company.",
      href:"https://x3nb.github.io/cafedreamr/PLAYLIST/SPIDER-LULLABY/index.html", hrefLabel:"open the music web \u2192" },

    hans_clue1:{ label:"clue i", glyph:"?", accent:"#ff2d95", line:"" },
    hans_clue2:{ label:"clue ii", glyph:"?", accent:"#ff2d95", line:"" },
    hans_clue3:{ label:"clue iii", glyph:"?", accent:"#ff2d95", line:"" },
    hans_clue4:{ label:"clue iv", glyph:"?", accent:"#ff2d95", line:"" }
  };

  var clueIds  = ["hans_clue1", "hans_clue2", "hans_clue3", "hans_clue4"];
  var clueLines = [
    "A faint waft of Earl Grey floats by\u2026 Someone snobby must be near.",
    "You hear muttering: \u2018Proper tea must steep in reverence\u2026\u2019",
    "Biscuit crumbs lead off-screen. Suspicious.",
    "A polished silver teaspoon lies abandoned\u2026 dramatic, British energy detected."
  ];
  var romans = ["i","ii","iii","iv"];
  var DOSSIER = "https://www.cafedreamr.art/LORE/OCS/CARDS-SOUNDS/cards.html";
  var REALM   = "https://x3nb.github.io/cafedreamr/index.html";
  var CHANNEL = "https://www.youtube.com/@cafedreamer";

  /* =============================================================== */
  /*                          HELPERS                                */
  /* =============================================================== */

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function prettify(a){
    return String(a).replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/_/g," ").toLowerCase();
  }
  function d(a){ return DISPLAY[a] || {}; }
  function accentOf(a){ return d(a).accent || "#c0a6ff"; }

  /* ---- generated sigil art: a unique portal glyph per seed ---- */
  function poly(n, r, rot){
    var pts = [];
    for(var k=0;k<n;k++){
      var a = (Math.PI*2*k/n) + (rot*Math.PI/180) - Math.PI/2;
      pts.push((50 + r*Math.cos(a)).toFixed(2) + "," + (50 + r*Math.sin(a)).toFixed(2));
    }
    return pts.join(" ");
  }
  function sigil(seed){
    var s = Math.abs(Math.floor(seed)) || 0;
    var rot = (s*37) % 360;
    var n1  = 3 + (s % 6);
    var n2  = 3 + ((s*5 + 2) % 7);
    var r1  = 28 + (s % 3) * 2.6;
    var r2  = 14 + (s % 4) * 3.4;
    var ticks = "";
    for(var k=0;k<4;k++){
      var a = (Math.PI*2*k/4) + (rot*Math.PI/180);
      ticks += '<line x1="' + (50 + 37*Math.cos(a)).toFixed(1) + '" y1="' + (50 + 37*Math.sin(a)).toFixed(1) +
               '" x2="' + (50 + 45*Math.cos(a)).toFixed(1) + '" y2="' + (50 + 45*Math.sin(a)).toFixed(1) + '"/>';
    }
    return '<svg class="sig" viewBox="0 0 100 100" aria-hidden="true" focusable="false">'
      + '<g class="rot"><circle class="ring" cx="50" cy="50" r="45"/>'
      +   '<polygon class="p1" points="' + poly(n1, r1, rot) + '"/></g>'
      + '<g class="rot2"><polygon class="p2" points="' + poly(n2, r2, rot*1.7) + '"/>' + ticks + '</g>'
      + '<circle class="halo" cx="50" cy="50" r="7.5"/>'
      + '<circle class="core" cx="50" cy="50" r="3.2"/>'
      + '</svg>';
  }
  function shotSrc(action){
    var src = tileImages[action];
    if(src && src !== tileImages["default"]) return src;
    return "";
  }
  function pfpHTML(portraitKey, action){
    var src = thumbnails[portraitKey] || tileImages[action] || "";
    var seed = (action || "x").length * 7 + 11;
    return '<span class="pfp">' + sigil(seed) +
      (src ? '<img src="' + esc(src) + '" alt="" aria-hidden="true" loading="lazy">' : "") +
      '</span>';
  }

  /* =============================================================== */
  /*                         PERSISTENCE                             */
  /* =============================================================== */

  var K_CLUES = "cd_grid_clues", K_SEEN = "cd_grid_seen";
  var clues = [], seen = [], store = null;
  try{
    store = window.localStorage;
    store.setItem("cd_grid_probe", "1"); store.removeItem("cd_grid_probe");
  }catch(e){ store = null; }

  function load(){
    try{
      clues = JSON.parse((store && store.getItem(K_CLUES)) || "[]") || [];
      seen  = JSON.parse((store && store.getItem(K_SEEN))  || "[]") || [];
    }catch(e){ clues = []; seen = []; }
    if(!(clues instanceof Array)) clues = [];
    if(!(seen  instanceof Array)) seen  = [];
  }
  function save(){
    try{
      if(store){
        store.setItem(K_CLUES, JSON.stringify(clues));
        store.setItem(K_SEEN,  JSON.stringify(seen));
      }
    }catch(e){}
  }
  function allClues(){ return clues.length === clueIds.length; }

  /* =============================================================== */
  /*                     POPUP + HELPERS                             */
  /* =============================================================== */

  var genericPopup = document.getElementById("genericPopup");
  var pcard        = document.getElementById("pcard");
  var pGlyph       = document.getElementById("pGlyph");
  var pTitle       = document.getElementById("pTitle");
  var pMeta        = document.getElementById("pMeta");
  var popupBody    = document.getElementById("popupBody");

  function showPopup(html, opts){
    opts = opts || {};
    pcard.style.setProperty("--accent", opts.accent || "#9d71e4");
    pGlyph.textContent = opts.glyph || "\u25c6";
    pTitle.textContent = opts.title || "portal output";
    pMeta.textContent  = opts.meta || "";
    popupBody.innerHTML = html;
    popupBody.scrollTop = 0;
    genericPopup.classList.add("active");
    document.body.style.overflow = "hidden";
    beep(opts.accent === "#ff2d95" ? 720 : 520, 0.05, "triangle");
    setTimeout(function(){ document.getElementById("px").focus(); }, 30);
  }
  function closePopup(){
    genericPopup.classList.remove("active");
    document.body.style.overflow = "";
    popupBody.innerHTML = "";
  }
  document.getElementById("px").addEventListener("click", closePopup);
  genericPopup.addEventListener("click", function(e){ if(e.target === genericPopup) closePopup(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && genericPopup.classList.contains("active")) closePopup();
  });

  /* buttons / links inside popups */
  popupBody.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-next],[data-act]") : null;
    if(!b || !popupBody.contains(b)) return;
    if(b.hasAttribute("data-next")){
      var w = b.getAttribute("data-who");
      (w === "star" ? renderNode(STAR, b.getAttribute("data-next")) : renderNode(HANS, b.getAttribute("data-next")));
      return;
    }
    var act = b.getAttribute("data-act");
    if(act === "close") closePopup();
    if(act === "seek") { closePopup(); seekSecret(); }
    if(act === "reset-yes"){ wipeTrail(); closePopup(); }
    if(act === "reset-no") closePopup();
  });

  /* =============================================================== */
  /*                       BUILD THE GRID                            */
  /* =============================================================== */

  var gallery = document.getElementById("gallery");

  function tileHTML(action, i){
    var o = d(action);
    var acc = o.accent || "#c0a6ff";
    var h = 252 + (i*9) % 68;
    var label = o.label || prettify(action);
    var isClue = clueIds.indexOf(action) > -1;
    var cls = ["tile"];
    if(isClue) cls.push("clue");
    if(action === "secret") cls.push("sealed");
    var src = shotSrc(action);
    var tagx = "";
    if(isClue) tagx = '<span class="tagx clue" data-role="clue" aria-hidden="true">?</span>';
    else if(action === "secret") tagx = '<span class="tagx lock" data-role="lock" aria-hidden="true">\u25a0</span>';
    return '<button class="' + cls.join(" ") + '" type="button" data-action="' + action + '"'
      + ' aria-label="open portal ' + pad(i+1) + ', ' + esc(label) + '">'
      + '<span class="art" style="--h:' + h + ';--gc:' + acc + '">' + sigil(i) + '</span>'
      + (src ? '<img class="shot" src="' + esc(src) + '" alt="" aria-hidden="true" loading="lazy" decoding="async">' : "")
      + '<span class="tint"></span><span class="scanl"></span><span class="sheen"></span>'
      + '<span class="idx">' + pad(i+1) + '</span>' + tagx
      + '<span class="cap">' + esc(label) + '</span>'
      + '</button>';
  }

  function renderGrid(){
    gallery.innerHTML = actions.map(tileHTML).join("");
  }
  function applyTileArt(tileEl, seed){
    var art = tileEl.querySelector(".art");
    if(!art) return;
    art.innerHTML = sigil(seed);
    art.style.setProperty("--h", 252 + (seed*9) % 68);
  }
  function paintTile(action){
    var tile = gallery.querySelector('[data-action="' + action + '"]');
    if(!tile) return;
    tile.classList.toggle("seen", seen.indexOf(action) > -1);
    var isClue = clueIds.indexOf(action) > -1;
    if(isClue){
      var found = clues.indexOf(action) > -1;
      tile.classList.toggle("found", found);
      var ct = tile.querySelector('[data-role="clue"]');
      if(ct){
        ct.textContent = found ? "\u2713" : "?";
        tile.querySelector(".art").style.setProperty("--gc", found ? "#ccff00" : "#ff2d95");
        tile.querySelector(".cap").style.setProperty("--gc", found ? "#ccff00" : "#ff2d95");
      }
    }
    if(action === "secret"){
      var open = allClues();
      tile.classList.toggle("unlocked", open);
      tile.querySelector(".art").style.setProperty("--gc", open ? "#ccff00" : "#ff2d95");
      tile.querySelector(".cap").style.setProperty("--gc", open ? "#ccff00" : "#ff2d95");
      tile.querySelector(".cap").textContent = open ? "the sealed door \u00b7 open" : "sealed";
      var lk = tile.querySelector('[data-role="lock"]');
      if(lk) lk.textContent = open ? "\u2713" : "\u25a0";
    }
  }
  function paintAll(){
    actions.forEach(paintTile);
    var cm = document.getElementById("clueMeter");
    document.getElementById("clueCount").textContent = clues.length + "/" + clueIds.length;
    document.getElementById("openCount").textContent = seen.length + "/" + actions.length;
    cm.classList.toggle("done", allClues());
  }
  function pingMeter(){
    ["clueMeter","openMeter"].forEach(function(id){
      var el = document.getElementById(id);
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
    });
  }
  function seekSecret(){
    var tile = gallery.querySelector('[data-action="secret"]');
    if(!tile) return;
    tile.scrollIntoView({behavior:"smooth", block:"center"});
    tile.classList.add("flash");
    setTimeout(function(){ tile.classList.remove("flash"); }, 900);
    beep(880, 0.09, "triangle");
  }
  function wipeTrail(){
    clues = []; seen = [];
    save(); paintAll();
    Array.prototype.slice.call(gallery.querySelectorAll(".tile")).forEach(function(t){
      t.classList.remove("glitching","morphing");
    });
    showPopup('<p class="dtext">The trail is wiped. Thirty-six portals, sealed again, waiting to be found for the first time.</p>',
      {title:"grid reset", accent:"#9d71e4", glyph:"\u21ba", meta:"0/36"});
  }

  /* =============================================================== */
  /*                  ACTION DISPATCHER (MAIN LOGIC)                 */
  /* =============================================================== */

  function handleAction(action, tile){
    if(seen.indexOf(action) < 0){ seen.push(action); save(); }
    tile.classList.add("seen");
    paintAll();
    pingMeter();

    if(action === "star"){ openChat(STAR); return; }
    if(action === "hans"){ openChat(HANS); return; }
    if(clueIds.indexOf(action) > -1){ foundClue(action); return; }
    if(action === "secret"){ openSecret(); return; }
    if(action === "glitch"){ glitchTile(tile); return; }
    if(action === "morph"){ morphTile(tile); return; }

    var i = actions.indexOf(action);
    var o = d(action);
    var acc = o.accent || "#c0a6ff";
    var html = '<p class="dtext">' + esc(o.line || "This tile's power has not yet been revealed.") + '</p>';
    var links = [];
    if(o.href) links.push({ label:o.hrefLabel, href:o.href });
    if(o.links && o.links.length) links = links.concat(o.links);
    if(links.length){
      html += '<div class="choices">' + links.map(function(l){
        return '<a class="chip" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">'
          + esc(l.label || "open \u2192") + '</a>';
      }).join("") + '</div>';
    }
    showPopup(html, {
      title: o.label || prettify(action),
      accent: acc, glyph: (o.glyph || "\u25c6"),
      meta: "portal " + pad(i+1)
    });
  }

  function openChat(who){
    renderNode(who, "start");
  }

  function foundClue(action){
    var i = clueIds.indexOf(action);
    var fresh = clues.indexOf(action) < 0;
    if(fresh){ clues.push(action); save(); }
    paintAll(); pingMeter();

    var dots = clueIds.map(function(c){
      return '<i class="' + (clues.indexOf(c) > -1 ? "on" : "") + '"></i>';
    }).join("");

    var html = '<div class="metarow">'
      + '<span class="chip tag pink">clue ' + romans[i] + ' of iv ' + (fresh ? "recovered" : "already read") + '</span>'
      + '<span class="dots">' + dots + '</span></div>'
      + '<p class="dtext">' + esc(clueLines[i]) + '</p>';

    if(allClues()){
      html += '<p class="dtext ok">All four clues recovered. The sealed door in the grid should be open now.</p>'
        + '<div class="choices"><button class="chip" type="button" data-act="seek">\u25b8 go to the sealed door</button></div>';
      beep(1040, 0.12, "triangle");
      setTimeout(function(){ beep(1320, 0.14, "triangle"); }, 110);
    } else {
      beep(fresh ? 760 : 420, 0.07, "square");
    }

    showPopup(html, {
      title: "clue " + romans[i] + " recovered",
      accent: "#ff2d95", glyph: "?", meta: clues.length + "/4"
    });
  }

  function openSecret(){
    if(!allClues()){
      var n = clues.length;
      showPopup(
        '<p class="dtext">Sealed. Four clues are hidden in this grid \u2014 the sort a tea snob would notice.</p>'
        + '<div class="metarow"><span class="chip tag dim">' + n + ' of 4 recovered</span>'
        + '<span class="chip tag dim">' + (4-n) + ' still hidden</span></div>',
        {title:"the sealed door", accent:"#ccff00", glyph:"\u25a0", meta:"locked"});
      return;
    }
    showPopup(
      '<p class="dtext">The sealed door grinds open\u2026</p>'
      + '<p class="dtext">Behind it: a small room, a proper cup of tea, and Hans, who is somehow already there.</p>'
      + '<p class="dtext">\u201cFour clues. Four. You may have potential after all.\u201d He slides a card across the table.</p>'
      + '<div class="choices">'
      + '<a class="chip" href="' + REALM + '" target="_blank" rel="noopener noreferrer">the realm map \u2192</a>'
      + '<a class="chip" href="' + DOSSIER + '" target="_blank" rel="noopener noreferrer">the collective, in dossiers \u2192</a>'
      + '</div>',
      {title:"the sealed door \u2014 open", accent:"#ccff00", glyph:"\u2713", meta:"unlocked"});
    beep(880, 0.1, "triangle");
    setTimeout(function(){ beep(1180, 0.16, "triangle"); }, 120);
  }

  /* =============================================================== */
  /*                          DIALOGUES                             */
  /* =============================================================== */

  var HANS = { id:"hans", name:"HANS", sub:"historian \u00b7 tea academy", accent:"#6495ed",
               portrait:"hansPortrait", action:"hans" };
  var STAR = { id:"star", name:"STAR", sub:"cafe owner \u00b7 literary navigator", accent:"#c0a6ff",
               portrait:"starPortrait", action:"star" };

  var hansDialogue = {
    start: {
      text: "\u201cWell well well\u2026 look what the chimera-cat dragged in.\u201d Hans adjusts his monocle dramatically. "
          + "\u201cTell me, traveler, do you even know the difference between real tea and leaf-flavoured disappointment?\u201d",
      options: [
        { label: "\u2026Yes?", next: "yes1" },
        { label: "No?", next: "no1" },
        { label: "About those four clues\u2026", next: "clues", when: allClues }
      ]
    },
    yes1: {
      text: "\u201cDo you now? How utterly precious.\u201d",
      options: [ { label: "Continue", next: "end" } ]
    },
    no1: {
      text: "\u201cOf course you don't. But at least you're honest.\u201d",
      options: [ { label: "Continue", next: "end" } ]
    },
    clues: {
      text: "He sets the cup down with the reverence of a man defusing something. "
          + "\u201cEarl Grey, crumbs, a teaspoon, and a habit of muttering. Four clues, and you found every one. "
          + "The sealed door is yours. Don't make me regret it.\u201d",
      options: [ { label: "Open the door", next: "end" } ]
    },
    end: {
      text: "\u201cRun along. I have tea to judge.\u201d",
      options: [ { label: "Close", next: "close" } ]
    }
  };

  var starDialogue = {
    start: {
      text: "\u201cWelcome to my sanctuary.\u201d",
      options: [
        { label: "Who are you?", next: "who" },
        { label: "What is this place?", next: "place" },
        { label: "I found all four clues.", next: "clues", when: allClues }
      ]
    },
    who: {
      text: "\u201cI'm Star. Once a chimera experiment\u2026 now adopted by Yeshua. Redeemed. Free.\u201d",
      options: [
        { label: "Tell me about Hans", next: "hansTalk" },
        { label: "Tell me about your past", next: "past" }
      ]
    },
    place: {
      text: "\u201cThe Chimera Caf\u00e9 sits between worlds. A refuge for the lost and the learning.\u201d",
      options: [ { label: "Who works here?", next: "who" } ]
    },
    hansTalk: {
      text: "\u201cHans? Snobby but loyal. If he insulted you, consider that affection.\u201d",
      options: [ { label: "He did insult me", next: "end" } ]
    },
    past: {
      text: "\u201cWe escaped because Yeshua pulled us out Himself. Light in the dark.\u201d",
      options: [ { label: "That's beautiful", next: "end" } ]
    },
    clues: {
      text: "\u201cAll four? Hans will pretend he isn't delighted.\u201d She glances at the grid. "
          + "\u201cEvery door here was catalogued so someone would eventually read it properly. That's you, then.\u201d",
      options: [ { label: "Open the sealed door", next: "end" } ]
    },
    end: {
      text: "\u201cStay as long as you need. You're safe here.\u201d",
      options: [ { label: "Close", next: "close" } ]
    }
  };

  function renderNode(who, key){
    var tree = who === STAR ? starDialogue : hansDialogue;
    var node = tree[key] || tree.start;
    var opts = (node.options || []).filter(function(o){
      return !o.when || o.when();
    });
    if(!opts.length) opts = [ { label: "Close", next: "close" } ];

    var html = '<div class="speaker" style="--accent:' + who.accent + '">'
      + pfpHTML(who.portrait, who.action)
      + '<span class="who"><b>' + esc(who.name) + '</b><em>' + esc(who.sub) + '</em></span></div>'
      + '<p class="dtext">' + esc(node.text) + '</p>'
      + '<div class="choices">'
      + opts.map(function(o){
          return '<button class="chip" type="button" data-next="' + esc(o.next) + '" data-who="' + who.id + '">'
            + esc(o.label) + '</button>';
        }).join("")
      + '</div>';

    showPopup(html, {
      title: who.id + " \u00b7 open channel",
      accent: who.accent,
      glyph: who.name.charAt(0),
      meta: "channel " + who.id
    });
  }

  /* =============================================================== */
  /*                         TILE EFFECTS                            */
  /* =============================================================== */

  function glitchTile(tile){
    tile.classList.add("glitching");
    beep(150, 0.16, "sawtooth");
    for(var k=0;k<5;k++){
      (function(k){
        setTimeout(function(){ beep(90 + Math.random()*260, 0.04, "square"); }, 140*k + 90);
      })(k);
    }
    setTimeout(function(){ tile.classList.remove("glitching"); }, 7000);
    showPopup(
      '<p class="dtext">The portal refuses to hold its shape. Somewhere behind it, something is laughing at you in a language made of static.</p>',
      {title:"glitch", accent:"#00e5ff", glyph:"\u2318", meta:"corrupted"});
  }
  function morphTile(tile){
    tile.classList.add("morphing");
    beep(300, 0.08, "sine");
    setTimeout(function(){
      applyTileArt(tile, Math.floor(Math.random()*997) + 3);
    }, 620);
    setTimeout(function(){
      tile.classList.remove("morphing");
      beep(560, 0.07, "sine");
    }, 980);
    showPopup(
      '<p class="dtext">The tile rearranges itself while you watch, and settles on a shape it seems happier with.</p>',
      {title:"morph", accent:"#00e5ff", glyph:"\u21c6", meta:"reshaped"});
  }

  /* =============================================================== */
  /*                   BEEPS (vending-machine flavour)               */
  /* =============================================================== */

  var actx = null;
  function beep(freq, dur, type){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = 0.03;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||0.06));
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + (dur||0.06) + 0.02);
    }catch(e){}
  }

  /* =============================================================== */
  /*                          WIRING UP                              */
  /* =============================================================== */

  gallery.addEventListener("click", function(e){
    var tile = e.target.closest ? e.target.closest(".tile") : null;
    if(!tile || !gallery.contains(tile)) return;
    handleAction(tile.getAttribute("data-action"), tile);
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!clues.length && !seen.length){
      showPopup('<p class="dtext">Nothing to reset \u2014 you haven\'t opened a single portal yet.</p>',
        {title:"reset trail", accent:"#9d71e4", glyph:"\u21ba", meta:"clean"});
      return;
    }
    showPopup(
      '<p class="dtext">Wipe the trail? Every portal you\'ve opened and every clue you\'ve read gets sealed again.</p>',
      {title:"reset trail", accent:"#ff2d95", glyph:"\u21ba", meta:""});
    popupBody.innerHTML += '<div class="choices">'
      + '<button class="chip" type="button" data-act="reset-yes">yes, wipe it</button>'
      + '<button class="chip" type="button" data-act="reset-no">never mind</button></div>';
  });

  /* images: hide the broken ones, fade the good ones in */
  document.addEventListener("error", function(e){
    var t = e.target;
    if(t && t.tagName === "IMG") t.remove();
  }, true);
  document.addEventListener("load", function(e){
    var t = e.target;
    if(!t || t.tagName !== "IMG") return;
    if(t.classList.contains("shot")){
      t.classList.add("on");
      var tile = t.closest(".tile");
      if(tile) tile.classList.add("hasimg");
    } else {
      t.classList.add("on");
    }
  }, true);

  /* =============================================================== */
  /*                        BOOT SEQUENCE                            */
  /* =============================================================== */

  (function boot(){
    var el = document.getElementById("bootTxt");
    if(!el) return;
    var narrow = window.innerWidth < 620;
    var msg = allClues()
      ? (narrow ? "grid open \u00b7 four clues recovered" : "grid open \u00b7 all four clues recovered \u00b7 the sealed door is waiting")
      : (narrow ? "decrypting the grid \u2026 36 portals sealed" : "decrypting the grid \u2026 36 portals sealed \u00b7 four clues hidden in plain sight");
    var n = 0;
    (function step(){
      el.textContent = msg.slice(0, n++);
      if(n <= msg.length) setTimeout(step, 22 + (n % 6) * 10);
    })();
  })();

  /* =============================================================== */
  /*                          STARFIELD                              */
  /* =============================================================== */

  (function stars(){
    var c = document.getElementById("stars");
    if(!c) return;
    var x = c.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0, list = [];
    function build(){
      w = c.width  = Math.floor(innerWidth  * dpr);
      h = c.height = Math.floor(innerHeight * dpr);
      list = [];
      var n = Math.min(200, Math.round(innerWidth * innerHeight / 8500));
      for(var i=0;i<n;i++){
        list.push({ x:Math.random()*w, y:Math.random()*h,
          r:(Math.random()*1.25 + 0.35) * dpr, a:Math.random()*0.6 + 0.2,
          s:Math.random()*0.16 + 0.02, p:Math.random()*Math.PI*2 });
      }
    }
    function tick(){
      x.clearRect(0,0,w,h);
      for(var i=0;i<list.length;i++){
        var s = list[i];
        s.p += 0.012;
        x.globalAlpha = s.a * (0.62 + 0.38*Math.sin(s.p));
        x.fillStyle = i % 13 === 0 ? "#ff2d95" : (i % 7 === 0 ? "#c0a6ff" : (i % 5 === 0 ? "#00e5ff" : "#fff0f5"));
        x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.284); x.fill();
        s.y += s.s * dpr;
        if(s.y > h + 2){ s.y = -2; s.x = Math.random()*w; }
      }
      x.globalAlpha = 1;
      requestAnimationFrame(tick);
    }
    build();
    addEventListener("resize", build, { passive:true });
    requestAnimationFrame(tick);
  })();

  /* =============================================================== */
  /*                            GO                                   */
  /* =============================================================== */

  load();
  renderGrid();
  paintAll();

  /* deep links: hans-mystery-grid.html#hans opens that portal */
  (function deepLink(){
    var id = (location.hash || "").replace(/^#/, "").toLowerCase();
    if(!id) return;
    var tile = gallery.querySelector('[data-action="' + id + '"]')
            || gallery.querySelector('[data-action="' + id.replace(/-/g,"_") + '"]');
    if(tile) setTimeout(function(){ tile.click(); }, 260);
  })();
})();
</script>
