<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Couture Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
  --pearl:#f8f7f4;
  --ivory:#fffdfb;
  --silver:#d8d8d8;
  --charcoal:#111111;
  --graphite:#666;
  --glass:rgba(255,255,255,.65);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;

  background:
  radial-gradient(circle at top left,#ffffff 0%,#f7f4ef 35%,#ece8e2 100%);

  font-family:'Inter',sans-serif;
  color:var(--charcoal);
}

/* pearl glow */

body::before{
  content:"";
  position:fixed;
  inset:0;

  background:
  radial-gradient(
  circle at 20% 20%,
  rgba(255,255,255,.9),
  transparent 35%
  ),
  radial-gradient(
  circle at 80% 30%,
  rgba(255,255,255,.7),
  transparent 40%
  );

  pointer-events:none;
}

/* subtle editorial grain */

body::after{
  content:"";
  position:fixed;
  inset:0;

  background-image:
  radial-gradient(
  rgba(255,255,255,.4) 1px,
  transparent 1px
  );

  background-size:80px 80px;

  opacity:.15;
  pointer-events:none;
}

/* floating chain */

.chain{
  position:fixed;
  top:0;
  right:70px;
  width:4px;
  height:240px;

  background:
  repeating-linear-gradient(
  to bottom,
  silver 0px 12px,
  transparent 12px 22px
  );

  opacity:.35;
}

#title{
  margin:30px 0 0;

  text-align:center;

  font-family:'Cormorant Garamond',serif;
  font-size:4rem;
  font-weight:700;

  letter-spacing:10px;
  text-transform:uppercase;
}

#subtitle{
  text-align:center;

  letter-spacing:8px;
  text-transform:uppercase;

  color:#888;

  font-size:.75rem;

  margin-bottom:20px;
}

#searchContainer{
  display:flex;
  justify-content:center;
  padding-bottom:20px;
}

#searchInput{
  width:60%;
  max-width:650px;

  padding:15px 25px;

  border-radius:999px;

  border:1px solid rgba(0,0,0,.08);

  background:rgba(255,255,255,.7);

  backdrop-filter:blur(15px);

  font-size:15px;

  transition:.3s;
}

#searchInput:focus{
  outline:none;

  border-color:#999;

  box-shadow:
  0 0 30px rgba(255,255,255,.8);
}

#content{
  display:flex;
  gap:20px;

  padding:0 25px 25px;

  height:calc(100vh - 180px);
}

/* sidebar */

#categories{
  width:340px;
  overflow-y:auto;

  padding-right:10px;
}

#categories::-webkit-scrollbar{
  width:6px;
}

#categories::-webkit-scrollbar-thumb{
  background:#cfcfcf;
  border-radius:999px;
}

/* accordion */

.category{
  margin-bottom:15px;

  border-radius:22px;

  overflow:hidden;

  background:var(--glass);

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
  0 15px 35px rgba(0,0,0,.08);

  transition:.3s;
}

.category:hover{
  transform:translateY(-3px);
}

.category h3{
  margin:0;

  padding:18px;

  cursor:pointer;

  font-family:'Cormorant Garamond',serif;

  font-size:1.4rem;

  letter-spacing:2px;

  text-transform:uppercase;

  background:
  linear-gradient(
  90deg,
  rgba(255,255,255,.8),
  rgba(245,245,245,.4)
  );

  border-bottom:1px solid rgba(0,0,0,.05);
}

.links{
  display:none;
  flex-direction:column;
  gap:8px;

  padding:15px;
}

.links.show{
  display:flex;
}

.link{
  text-decoration:none;

  color:#222;

  background:white;

  padding:12px 14px;

  border-radius:12px;

  border-left:3px solid silver;

  transition:.25s;
}

.link:hover{
  transform:translateX(8px);

  border-left-color:black;

  background:#fafafa;
}

/* viewer */

#tv{
  flex:1;

  overflow:hidden;

  border-radius:35px;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,.85),
  rgba(245,245,245,.65)
  );

  backdrop-filter:blur(25px);

  border:1px solid rgba(255,255,255,.9);

  box-shadow:
  0 25px 60px rgba(0,0,0,.12);
}

#tv iframe{
  width:100%;
  height:100%;
  border:none;
}

.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;

  height:100%;

  font-family:'Cormorant Garamond',serif;

  font-size:2rem;

  letter-spacing:3px;

  color:#888;
}

</style>
</head>

<body>

<div class="chain"></div>

<h1 id="title">Couture Archive</h1>

<div id="subtitle">
PEARL • PUNK • COUTURE
</div>

<div id="searchContainer">
<input
type="text"
id="searchInput"
placeholder="Search the archive..."
>
</div>

<div id="content">

<div id="categories"></div>

<div id="tv">
<div class="placeholder" id="placeholder">
SELECT A DESTINATION
</div>

<iframe id="tvFrame" src="" style="display:none;"></iframe>
</div>

</div>

<script>

const data = {

"Fashion":[
{
name:"Vogue",
url:"https://www.vogue.com"
},
{
name:"Business of Fashion",
url:"https://www.businessoffashion.com"
}
],

"Inspiration":[
{
name:"Pinterest",
url:"https://www.pinterest.com"
},
{
name:"Are.na",
url:"https://www.are.na"
}
],

"Creative":[
{
name:"Behance",
url:"https://www.behance.net"
},
{
name:"Dribbble",
url:"https://dribbble.com"
}
]

};

const categoriesDiv =
document.getElementById("categories");

const searchInput =
document.getElementById("searchInput");

const tvFrame =
document.getElementById("tvFrame");

const placeholder =
document.getElementById("placeholder");

function createCategories(){

for(const [categoryName,links]
of Object.entries(data)){

const category =
document.createElement("div");

category.className =
"category";

const header =
document.createElement("h3");

header.textContent =
categoryName;

const linksDiv =
document.createElement("div");

linksDiv.className =
"links";

header.onclick=()=>{
linksDiv.classList.toggle("show");
};

links.forEach(link=>{

const a =
document.createElement("a");

a.className="link";

a.href="#";

a.textContent=
link.name;

a.onclick=(e)=>{

e.preventDefault();

loadWebsite(link.url);

};

linksDiv.appendChild(a);

});

category.appendChild(header);
category.appendChild(linksDiv);

categoriesDiv.appendChild(category);

}

}

function loadWebsite(url){

placeholder.style.display="none";

tvFrame.style.display="block";

tvFrame.src=url;

}

searchInput.addEventListener(
"input",
()=>{

const query =
searchInput.value.toLowerCase();

document
.querySelectorAll(".category")
.forEach(category=>{

const links =
category.querySelectorAll(".link");

let visible=false;

links.forEach(link=>{

const match =
link.textContent
.toLowerCase()
.includes(query);

link.style.display =
match ? "" : "none";

if(match) visible=true;

});

category.style.display =
visible ? "" : "none";

});

}
);

createCategories();

</script>

</body>
</html>
