<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --plum:#0d001a; --ink:#0b0b0e; --ink2:#141419; --ink3:#1b1b22;
  --lime:#ccff00; --pink:#ff2d95; --cyan:#00e5ff;
  --violet:#bf40bf; --violet2:#ee82ee; --corn:#6495ed; --mint:#98fb98;
  --cream:#e9e6de; --lav:#fff0f5; --dim:#7d848b;
  --line:rgba(255,255,255,.10);
  --mono:'Space Mono',ui-monospace,monospace;
  --disp:'Bebas Neue',impact,sans-serif;
  --logo:'Vampiro One',cursive;
  --body:'Klee One',system-ui,sans-serif;
  --a:#6495ed;
}
body{background:var(--plum);color:var(--lav);font-family:var(--body);text-align:left;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(780px 540px at 16% 6%, color-mix(in srgb,var(--a) 16%,transparent), transparent 62%),
    radial-gradient(640px 480px at 94% 108%, rgba(238,130,238,.06), transparent 60%),
    linear-gradient(180deg,#0d001a,#0b0b0e 55%,#0d001a)}
.bg:after{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px)}
.stage{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:22px 14px 34px;
  display:flex;flex-direction:column;gap:14px}
.marquee{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{display:block;font-family:var(--logo);font-size:27px;letter-spacing:.05em;color:var(--a);
  text-shadow:0 0 16px color-mix(in srgb,var(--a) 42%,transparent)}
.tag{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin-top:4px}
.back{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--violet2);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;white-space:nowrap}
.back:hover{color:var(--lime);border-bottom-color:currentColor}

.scene{display:grid;grid-template-columns:236px 1fr;gap:14px;align-items:start;cursor:pointer;
  border:1px solid var(--line);border-radius:16px;padding:14px;
  background:linear-gradient(165deg,rgba(27,0,44,.55),rgba(11,11,14,.82));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 60px rgba(0,0,0,.5)}
.scene:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.portrait{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 28px color-mix(in srgb,var(--a) 26%,transparent);
  animation:fadein .9s ease both}
.portrait img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center 24%}
.portrait:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 42%,rgba(11,11,14,.74)),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px)}
.portrait figcaption{position:absolute;left:9px;right:9px;bottom:8px;z-index:2;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--a)}

.dialog{display:flex;flex-direction:column;gap:9px;min-height:216px;padding:13px 14px;border-radius:12px;
  background:rgba(10,0,20,.55);border:1px solid color-mix(in srgb,var(--a) 30%,transparent);backdrop-filter:blur(6px)}
.dialog .who{font-family:var(--disp);font-size:16px;letter-spacing:.10em;color:var(--a)}
.dialog .txt{font-size:15.5px;line-height:1.68;color:var(--lav);white-space:pre-wrap}
.dialog .txt.room{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);text-align:center;align-self:center;max-width:94%}
.caret{display:inline-block;width:7px;height:14px;background:var(--a);vertical-align:-2px;
  margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.hint{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.count{display:flex;align-items:baseline;flex-wrap:wrap;gap:9px;padding-top:9px;border-top:1px dashed var(--line);
  font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.count .k{font-size:20px;letter-spacing:.03em;color:var(--a)}
.count.late .k{display:none}
.count.late{color:var(--violet2)}
.count.over .k{display:none}
.count.over{color:var(--dim)}
.links{display:flex;flex-wrap:wrap;gap:9px}
.links a{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;
  color:var(--lav);border:1px solid color-mix(in srgb,var(--a) 42%,transparent);border-radius:999px;
  padding:8px 13px;transition:.18s}
.links a:hover{border-color:var(--a);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--a) 30%,transparent)}
.links a.ghost{border-color:var(--line);color:var(--dim)}
.links a.ghost:hover{color:var(--violet2);border-color:currentColor;box-shadow:none}

.foot{font-family:var(--mono);font-size:9px;letter-spacing:.1em;line-height:1.95;color:var(--dim);text-align:center;padding-top:4px}
.foot a{color:var(--violet2);text-decoration:none}
.foot a:hover{color:var(--lime)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:680px){
  .scene{grid-template-columns:1fr;padding:12px}
  .portrait{width:186px;margin:0 auto}
  .dialog{min-height:196px}
  .brand{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  .portrait,.hint,.caret{animation:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="stage">
  <header class="marquee">
    <div>
      <span class="brand">hans</span>
      <span class="tag">the stacks &middot; CC-005</span>
    </div>
    <a class="back" href="https://www.cafedreamr.art/">&larr; the terminal</a>
  </header>

  <section class="scene" id="scene" role="button" tabindex="0" aria-label="continue the conversation">
    <figure class="portrait">
      <img id="shot" alt="hans, monocle in place, holding a teacup in the stacks"
        src="https://user.uploads.dev/file/3319225749983203c7c8561fac0a5684.jpg">
      <figcaption>hans &middot; historian &amp; tea academy</figcaption>
    </figure>

    <div class="dialog">
      <div class="who" id="who">hans</div>
      <div class="txt" id="txt"></div><span class="caret" id="caret" hidden></span>
      <div class="bottom">
        <div class="hint" id="hint" hidden>&#9656; tap to continue</div>
        <div class="count" id="count" hidden>
          <span id="kLabel">the etiquette class begins in</span><b class="k" id="k">--:--</b>
        </div>
        <div class="links" id="links" hidden></div>
      </div>
    </div>
  </section>

  <div class="foot">
    <a href="https://www.cafedreamr.art/">the terminal</a> &middot;
    <a href="https://www.cafedreamr.art/MIKI/">miki's place</a> &middot;
    <a href="https://www.cafedreamr.art/PASSPORT/">your stamp card</a> &middot;
    <a href="https://www.cafedreamr.art/CLASS/?id=etiquette">the etiquette class</a> &middot;
    <a href="https://www.cafedreamr.art/LORE/MAP.html">the realm map</a> &middot;
    <a href="https://www.cafedreamr.art/LORE/MYSTERYGRID/">the mystery grid</a><br>
    &copy; cafedreamr &middot; attendance is kept in this browser
  </div>
</main>

<script src="https://www.cafedreamr.art/PASSPORT/cd-passport.js"></script>
<script>
/* ============================================================
   hans &mdash; the tea cup's door                 HANS/index.html
   The player took the tea at the terminal (or came up from
   miki's), so the cup led here. One written conversation, and
   then the clock. The etiquette class no longer keeps the
   academy's old wall-clock hour: hans sets the hour when he
   asks — twenty minutes, and not one more. This page writes
   that hour down for the browser (cd_class_at_etiquette, the
   very key CLASS/index.html reads) and counts down to it, so
   the host's page and the room always agree. Nobody is asked
   to wait seven hours for a cup of tea.
   ============================================================ */
(function () {
  "use strict";

  var LINES = [
    { who: "hans", say: "Ah. You found the stacks. Most people stop at the monocle and call it a visit." },
    { who: "hans", say: "Sit — no, not that chair, the other one leans. I have been meaning to fix it for eleven years, and I fully intend to continue meaning to." },
    { room: "he pours, unhurried, and does not measure." },
    { who: "hans", say: "Earl grey. The bergamot does most of the work and I permit it. Milk first, incidentally, is not sentiment — it is method, and I shall not be taking questions at this hour." },
    { who: "hans", say: "Miki telephoned, of course. She always telephones. She rang the monocle mid-examination to ask whether you had taken the tea — a question she could have put to you directly, and simply chose not to." },
    { who: "hans", say: "Here. Both hands — not for the rule's sake, the cup is hot. There is a difference, and I will be quizzing you on it." },
    { room: "he looks at his watch. then at it again, as though the second look might disagree with the first." },
    { who: "hans", say: "Ah. Ah, no. The hour has run off with me again. I have a class to begin — the academy does not open itself, whatever Miki will tell you." },
    { who: "hans", say: "It begins in twenty minutes. Not near twenty — at twenty. That leaves you enough time to arrive, and precisely enough time to be late. The room is written down for you below. Go on — be on time. I notice these things." }
  ];

  var LINKS = [
    { href: "https://www.cafedreamr.art/CLASS/?id=etiquette", text: "go to the class \u2192", main: true },
    { href: "https://www.cafedreamr.art/", text: "back to the terminal \u2192" }
  ];

  var scene = document.getElementById("scene"),
      whoEl = document.getElementById("who"),
      txtEl = document.getElementById("txt"),
      caretEl = document.getElementById("caret"),
      hintEl = document.getElementById("hint"),
      linksEl = document.getElementById("links"),
      countEl = document.getElementById("count"),
      kEl = document.getElementById("k"),
      kLabel = document.getElementById("kLabel");

  var i = 0, typing = false, ended = false, timer = null, full = "", onTyped = null;
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}

  /* the class is set when hans asks — twenty minutes from that moment, and
     not one more. the hour is written down for this browser under the same
     key the room reads (CLASS/index.html: cd_class_at_etiquette), so the
     countdown here and the door there always name the same minute. once it
     has begun the room stays open for WINDOW_MIN minutes. */
  var WAIT_MIN = 20, WINDOW_MIN = 120, AT_KEY = "cd_class_at_etiquette";
  function classAt() { try { return parseInt(window.localStorage.getItem(AT_KEY), 10) || 0; } catch (e) { return 0; } }
  function setClassAt(ms) { try { window.localStorage.setItem(AT_KEY, String(ms)); } catch (e) {} }
  function windowMs() { return WINDOW_MIN * 60000; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function mmss(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + pad(s % 60);
  }
  function paintCount() {
    var at = classAt(), now = Date.now();
    if (at && now < at) {
      countEl.classList.remove("late", "over");
      kLabel.textContent = "the etiquette class begins in";
      kEl.textContent = mmss(at - now);
    } else if (at && now < at + windowMs()) {
      countEl.classList.add("late"); countEl.classList.remove("over");
      kLabel.textContent = "the bell has gone. come in quietly — he will pretend you were early.";
    } else {
      countEl.classList.remove("late"); countEl.classList.add("over");
      kLabel.textContent = "the class is done for today. sit with him again and he will set the next one — precisely.";
    }
  }
  function tick() { paintCount(); setTimeout(tick, 1000); }
  tick();

  function paintLinks() {
    LINKS.forEach(function (l) {
      var a = document.createElement("a");
      a.href = l.href;
      a.textContent = l.text;
      if (!l.main) a.className = "ghost";
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      linksEl.appendChild(a);
    });
  }

  function settle() {
    caretEl.hidden = true;
    hintEl.hidden = false;
  }

  function type(text, done) {
    full = text;
    onTyped = done;
    typing = true;
    txtEl.textContent = "";
    caretEl.hidden = false;
    if (REDUCE) { typing = false; txtEl.textContent = text; done(); return; }
    var k = 0;
    function step() {
      if (!typing) return;
      k++;
      txtEl.textContent = full.slice(0, k);
      if (k >= full.length) {
        typing = false;
        caretEl.hidden = true;
        var f = onTyped; onTyped = null;
        if (f) f();
        return;
      }
      timer = setTimeout(step, 17 + Math.random() * 20);
    }
    timer = setTimeout(step, 130);
  }

  function finish() {
    if (!typing) return false;
    typing = false;
    clearTimeout(timer);
    txtEl.textContent = full;
    caretEl.hidden = true;
    var f = onTyped; onTyped = null;
    if (f) f();
    return true;
  }

  function show() {
    var L = LINES[i++];
    hintEl.hidden = true;
    if (L.room) {
      whoEl.hidden = true;
      txtEl.className = "txt room";
      type(L.room, settle);
    } else {
      whoEl.hidden = false;
      whoEl.textContent = L.who || "hans";
      txtEl.className = "txt";
      type(L.say, settle);
    }
  }

  function end() {
    if (ended) return;
    ended = true;
    hintEl.hidden = true;
    /* he has just named the hour: twenty minutes from this moment. write it
       down — unless an hour is already set and still to come (he does not
       make you wait twice), or the room is open (he does not make you wait
       again). a finished class gets a fresh invitation. */
    var at = classAt(), now = Date.now();
    if (!at || now >= at + windowMs()) setClassAt(now + WAIT_MIN * 60000);
    paintCount();
    countEl.hidden = false;
    linksEl.hidden = false;
  }

  function advance() {
    if (finish()) return;
    if (i < LINES.length) show();
    else end();
  }

  paintLinks();
  scene.addEventListener("click", advance);
  scene.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); advance(); }
  });
  show();

  if (window.CD) { try { CD.boot({ page: "hans" }); } catch (e) {} }
})();
</script>
</body>
