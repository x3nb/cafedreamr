<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>socialdreamr</title>
<meta name="description" content="socialdreamr — a brutalist lobby for chatting and sharing mp3s. put your name up, drop your link, pass tracks around.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{background:#fff}
body{margin:0;color:#000;font-family:'Space Mono',ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased}
.sd{max-width:900px;margin:0 auto;padding:28px 16px 60px}
.sdStamp{display:inline-block;background:#000;color:#fff;font-weight:700;font-size:22px;letter-spacing:.14em;padding:10px 16px;margin-bottom:6px}
.sdTag{font-size:12px;margin:0 0 20px;max-width:60ch}
.sdGrid{display:grid;grid-template-columns:1fr 200px;gap:16px}
.sdBox{border:3px solid #000;background:#fff;box-shadow:6px 6px 0 #000;padding:14px;margin-bottom:16px}
.sdBox h2{font-size:12px;letter-spacing:.2em;margin:0 0 10px;text-transform:uppercase}
.sdRow{display:flex;gap:8px;flex-wrap:wrap}
.sdRow input{flex:1;min-width:0;font-family:inherit;font-size:13px;color:#000;background:#fff;border:3px solid #000;padding:10px 12px;border-radius:0;outline:none}
.sdRow input:focus{background:#f2f2f2}
button{font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:#000;border:3px solid #000;padding:10px 16px;border-radius:0;cursor:pointer}
button:hover{background:#fff;color:#000}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{background:#000;color:#fff}
.sdNote{font-size:11px;margin:10px 0 0}
.sdFeed{height:min(58vh,480px);overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sdSideK{font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 10px}
.sdWho{font-size:12px;margin-bottom:10px;overflow-wrap:anywhere}
.sdWho a{color:#000;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.sdWho .st{color:#555;font-size:10px}
.sdMsg{font-size:13px;line-height:1.6;overflow-wrap:anywhere;border-top:2px solid #000;padding-top:10px}
.sdMsg:first-child{border-top:none;padding-top:0}
.sdMsg .who{font-weight:700;color:#000}
.sdMsg a.who{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.sdMsg .at{color:#555;font-size:10px;margin-left:8px}
.sdMsg .tx a{color:#000;text-decoration:underline;text-decoration-thickness:2px}
.sdMsg audio{width:100%;height:34px;margin-top:8px;display:block}
.sdTrack{border:3px solid #000;margin-top:8px;padding:8px}
.sdTrack .tt{font-weight:700;font-size:11px;letter-spacing:.06em;margin-bottom:6px;overflow-wrap:anywhere}
.sdMsg.wait{border:3px dashed #000;padding:8px}.sdMsg button.mini{font-size:9px;padding:4px 8px;margin:6px 6px 0 0}.sdSys{font-size:11px;color:#000;background:#f2f2f2;border:2px dashed #000;padding:6px 8px;text-align:center}
.sdStage{display:none;border:3px dashed #000;padding:8px 10px;margin-bottom:10px;font-size:12px;align-items:center;gap:10px}
.sdStage.on{display:flex}
.sdStage.busy .st{animation:blink 1s infinite}
.sdStage button{margin-left:auto;padding:6px 10px}
@keyframes blink{50%{opacity:.3}}
.sdSend{display:flex;gap:8px}
.sdSend input{flex:1;min-width:0;font-family:inherit;font-size:13px;border:3px solid #000;padding:10px 12px;border-radius:0;outline:none}
@media (max-width:640px){.sdGrid{grid-template-columns:1fr}.sdStamp{font-size:17px}}
</style>
</head>
<body>
<div class="sd">
  <div><span class="sdStamp">SOCIALDREAMR</span></div>
  <p class="sdTag">a lobby for talking and passing tracks around. everyone gets one link — yours prints under everything you say.</p>
  <div class="sdRow" style="margin-bottom:16px;max-width:420px;">
    <button id="sdCopy" type="button">Copy invite</button>
    <button id="sdClear" type="button">Clear stack</button>
  </div>
  <div class="sdBox">
    <h2>Your card</h2>
    <div class="sdRow">
      <input id="sdName" maxlength="24" placeholder="YOUR NAME" aria-label="your name" autocomplete="off">
      <input id="sdSite" maxlength="200" placeholder="YOUR LINK (SITE, SOCIAL, WHATEVER)" aria-label="your link" autocomplete="off" inputmode="url">
      <button id="sdJoin" type="button">Walk in</button>
      <button id="sdReset" type="button">Reset</button>
    </div>
    <div class="sdRow" style="margin-top:8px;max-width:420px;"><input id="sdMod" maxlength="64" placeholder="MOD CODE (OWNERS)" aria-label="mod code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="sdModGo" type="button">Mod</button></div>
    <p class="sdNote" id="sdNote">Put your name up and walk in.</p>
  </div>
  <div class="sdGrid">
    <div class="sdBox"><div class="sdFeed" id="sdFeed" aria-live="polite"></div></div>
    <div class="sdBox"><p class="sdSideK">Here now</p><div id="sdRoster"></div></div>
  </div>
  <div class="sdBox">
    <h2>Say it / play it</h2>
    <div class="sdStage" id="sdStage"><span class="st" id="sdStageT"></span><button id="sdStageX" type="button">Drop</button></div>
    <div class="sdSend">
      <input id="sdText" maxlength="300" placeholder="say something, or paste an mp3 link" aria-label="chat message" autocomplete="off" disabled>
      <button id="sdAttach" type="button" disabled>MP3</button>
      <button id="sdSend" type="button" disabled>Send</button>
    </div>
    <input id="sdFile" type="file" accept="audio/mpeg,audio/mp3,.mp3" hidden>
  </div>
</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://xzhsscjdaffzldnqwpxl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6aHNzY2pkYWZmemxkbnF3cHhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTY0NzcsImV4cCI6MjEwMjMzMjQ3N30.dc7UFaby8qmFue6UNr2QodurIPFGQBtAMz1EmBizt5g";

const byId = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function sys(s) {
  const f = byId("sdFeed"), d = document.createElement("div");
  d.className = "sdSys"; d.textContent = s;
  f.appendChild(d);
  while (f.children.length > 80) f.removeChild(f.firstChild);
  f.scrollTop = f.scrollHeight;
}
function linkify(s) {
  const parts = String(s).split(/(https?:\/\/[^\s<>"]+)/g);
  let out = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) out += '<a href="' + esc(parts[i]) + '" target="_blank" rel="noopener noreferrer">' + esc(parts[i]) + "</a>";
    else out += esc(parts[i]);
  }
  return out;
}
function mp3url(s) {
  const m = /https?:\/\/[^\s<>"]+?\.mp3(\?[^\s<>"]*)?/i.exec(String(s));
  return m ? m[0] : "";
}
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function myName() { return (byId("sdName").value || "").trim().slice(0, 24) || "visitor"; }
function mySite() {
  let v = (byId("sdSite").value || "").trim().slice(0, 200);
  if (v && !/^https?:\/\//i.test(v)) v = "https://" + v;
  return /^https?:\/\/[^ \t\n<>"]+$/.test(v) ? v : "";
}
function whoHtml(name, site) {
  if (site) return '<a class="who" href="' + esc(site) + '" target="_blank" rel="noopener noreferrer">' + esc(name) + "</a>";
  return '<span class="who">' + esc(name) + "</span>";
}
function fmtTime(at) {
  try { return new Date(at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); } catch (e) { return ""; }
}
function msgHtml(m) {
  let h = "<div>" + whoHtml(m.name, m.site) + '<span class="at">' + esc(fmtTime(m.created_at)) + "</span></div>";
  if (m.text) {
    const found = mp3url(m.text);
    if (found && m.text.trim() === found.trim()) {
      h += '<div class="sdTrack"><div class="tt">' + esc(found.split("/").pop().split("?")[0] || "TRACK") + '</div><audio controls preload="none" src="' + esc(found) + '"></audio></div>';
    } else {
      h += '<div class="tx">' + linkify(m.text) + "</div>";
      if (found) h += '<div class="sdTrack"><div class="tt">TRACK</div><audio controls preload="none" src="' + esc(found) + '"></audio></div>';
    }
  }
  if (m.audio) h += '<div class="sdTrack"><div class="tt">' + esc(m.atitle || "TRACK") + '</div><audio controls preload="none" src="' + esc(m.audio) + '"></audio></div>';
  if (isMod || m.name === myName()) h += ' <button class="mini" data-del="' + m.id + '">drop</button>'; if (isMod && m.approved === false) h += ' <button class="mini" data-ok="' + m.id + '">let in</button>'; return h;
}
function addMsg(m) { if (m.approved === false && !isMod) return;
  const f = byId("sdFeed"), near = f.scrollHeight - f.scrollTop - f.clientHeight < 60;
  const d = document.createElement("div");
  d.className = "sdMsg" + (m.approved === false ? " wait" : "");
  d.dataset.id = m.id;
  d.innerHTML = msgHtml(m);
  if (!f.querySelector('[data-id="' + m.id + '"]')) f.appendChild(d);
  while (f.children.length > 80) f.removeChild(f.firstChild);
  if (near) f.scrollTop = f.scrollHeight;
}
function roster(list) {
  const r = byId("sdRoster");
  r.innerHTML = list.map((p) => {
    const nm = p.site ? '<a href="' + esc(p.site) + '" target="_blank" rel="noopener noreferrer">' + esc(p.name) + "</a>" : esc(p.name);
    return '<div class="sdWho">' + nm + "</div>";
  }).join("") || '<div class="sdWho"><span class="st">quiet in here</span></div>';
}
function setOpen(open) {
  byId("sdText").disabled = !open;
  byId("sdAttach").disabled = !open;
  byId("sdSend").disabled = !open;
  byId("sdJoin").textContent = open ? "Step out" : "Walk in";
}

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let chan = null, staged = null, lastSend = 0, joined = false, isMod = false, moderated = false, admHash = '';

async function loadRecent() {
  const { data, error } = await sb.from("messages").select("*").order("created_at", {ascending: false}).limit(30);
  if (error) { sys("couldn't pull the recent stack — check the sql setup."); return; }
  (data || []).reverse().forEach(addMsg);
  byId("sdFeed").scrollTop = byId("sdFeed").scrollHeight;
}
function paintPresence() {
  if (!chan) return;
  const state = chan.presenceState();
  const list = [];
  for (const id in state) (state[id] || []).forEach((p) => { if (p.name) list.push(p); });
  list.sort((a, b) => String(a.name).localeCompare(String(b.name)));
  roster(list);
}
async function join() {
  try { const st = await sb.from('settings').select('*'); (st.data || []).forEach(function (r) { if (r.key === 'moderated') moderated = (r.value === 'true'); if (r.key === 'admin_hash') admHash = r.value || ''; }); } catch (e) {}
  if (joined) return;
  const me = {name: myName(), site: mySite()};
  store("sdName", byId("sdName").value);
  store("sdSite", byId("sdSite").value);
  chan = sb.channel("socialdreamr-lobby", {config: {presence: {key: "x" + Math.random().toString(36).slice(2)}}});
  chan.on("presence", {event: "sync"}, paintPresence);
  chan.on("presence", {event: "join"}, paintPresence);
  chan.on("presence", {event: "leave"}, paintPresence);
  chan.on("postgres_changes", {event: "UPDATE", schema: "public", table: "messages"}, function (p) { if (!p.new) return; const ex = byId("sdFeed").querySelector("[data-id='" + p.new.id + "']"); if (p.new.approved && !ex) addMsg(p.new); else if (p.new.approved && ex) ex.innerHTML = msgHtml(p.new); else if (!p.new.approved && ex && !isMod) ex.remove(); });
  chan.on("postgres_changes", {event: "DELETE", schema: "public", table: "messages"}, function (p) { if (!p.old) return; const ex = byId("sdFeed").querySelector("[data-id='" + p.old.id + "']"); if (ex) ex.remove(); });
  chan.on("postgres_changes", {event: "INSERT", schema: "public", table: "messages"}, (p) => { if (p.new) addMsg(p.new); });
  const st = await new Promise((resolve) => {
    let done = false;
    const to = setTimeout(() => { if (!done) { done = true; resolve("TIMED_OUT"); } }, 10000);
    chan.subscribe((s) => {
      if (done || typeof s !== "string") return;
      if (s === "SUBSCRIBED" || s === "TIMED_OUT" || s === "CHANNEL_ERROR" || s === "CLOSED") {
        done = true; clearTimeout(to); resolve(s);
      }
    });
  });
  if (st !== "SUBSCRIBED") { chan = null; await diagnose(st); return; }
  await chan.track(me);
  joined = true;
  setOpen(true);
  sys("you walked in as " + me.name);
  loadRecent();
}
async function diagnose(st) {
  let msg = "the door stuck (" + st + "). ";
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/messages?select=id&limit=1", {headers: {apikey: SUPABASE_ANON_KEY}});
    if (r.status === 401 || r.status === 403) msg += "the key was rejected — recheck the anon key.";
    else if (r.ok || r.status === 404) msg += "key is fine, so realtime is being blocked — check adblock or brave shields for this site.";
    else msg += "supabase answered " + r.status + " — send me that number.";
  } catch (e) { msg += "supabase is unreachable — check connection or vpn."; }
  sys(msg);
}
async function leave() {
  joined = false, isMod = false, moderated = false, admHash = '';
  if (chan) { try { await chan.untrack(); } catch (e) {} try { await sb.removeChannel(chan); } catch (e) {} chan = null; }
  setOpen(false); roster([]);
  sys("you stepped out");
}
async function sendIt() {
  if (!joined || !chan) return;
  const v = (byId("sdText").value || "").trim().slice(0, 300);
  if (!v && !staged) return;
  if (Date.now() - lastSend < 1500) { sys("easy — one at a time."); return; }
  lastSend = Date.now();
  const row = {name: myName(), site: mySite(), text: v || "", approved: !moderated};
  if (staged) { row.audio = staged.url; row.atitle = staged.title; }
  byId("sdText").value = ""; stageClear();
  const { error } = await sb.from("messages").insert(row);
  if (error) sys("that didn't land — try again.");
}
function stageBusy(label) {
  byId("sdStage").classList.add("on", "busy");
  byId("sdStageT").textContent = label;
}
function stageTrack(title) {
  byId("sdStage").classList.add("on");
  byId("sdStage").classList.remove("busy");
  byId("sdStageT").textContent = "TRACK READY: " + title;
}
function stageClear() {
  staged = null;
  byId("sdStage").classList.remove("on", "busy");
}
async function attach() {
  const f = byId("sdFile").files && byId("sdFile").files[0];
  byId("sdFile").value = "";
  if (!f || !joined) return;
  const okType = (f.type || "").indexOf("audio/") === 0 || /\.mp3$/i.test(f.name || "");
  if (!okType) { sys("mp3s only for the decks."); return; }
  if (f.size > 24 * 1024 * 1024) { sys("too big — keep it under ~24mb."); return; }
  const title = ((f.name || "track").replace(/\.[^.]*$/, "") || "track").slice(0, 80);
  stageBusy("lifting " + title + " …");
  const ext = /\.mp3$/i.test(f.name || "") ? ".mp3" : "";
  const path = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8) + ext;
  const { error } = await sb.storage.from("tracks").upload(path, f, {contentType: f.type || "audio/mpeg"});
  if (error) {
    sys(error.message && /row-level|policy|permission/i.test(error.message) ? "storage said no — run the bucket half of the sql setup." : "that file wouldn't lift — try again.");
    stageClear(); return;
  }
  const { data } = sb.storage.from("tracks").getPublicUrl(path);
  if (!data || !data.publicUrl) { sys("that file wouldn't lift — try again."); stageClear(); return; }
  staged = {url: data.publicUrl, title: title};
  stageTrack(title);
}

try { if (sessionStorage.getItem("sdmod") === "1") isMod = true; } catch (e) {}
const sn = load("sdName"), ss = load("sdSite");
if (sn) byId("sdName").value = sn;
if (ss) byId("sdSite").value = ss;
byId("sdName").addEventListener("change", () => store("sdName", byId("sdName").value));
byId("sdSite").addEventListener("change", () => store("sdSite", byId("sdSite").value));
byId("sdJoin").addEventListener("click", () => { if (joined) leave(); else join(); });
byId("sdReset").addEventListener("click", async () => {
  if (joined) await leave();
  byId("sdName").value = ""; byId("sdSite").value = "";
  try { localStorage.removeItem("sdName"); localStorage.removeItem("sdSite"); } catch (e) {}
  sys("card wiped — fresh start.");
});
byId("sdSend").addEventListener("click", sendIt);
byId("sdText").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendIt(); } });
byId("sdStageX").addEventListener("click", stageClear);
byId("sdAttach").addEventListener("click", () => byId("sdFile").click());
byId("sdFile").addEventListener("change", attach);
byId("sdCopy").addEventListener("click", function () {
  const link = location.href.split("#")[0];
  const done = function () { sys("invite copied - pass it on."); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { sys(link); });
  else sys(link);
});
async function clearStack(btn) {
  if (!joined) { sys("walk in first."); return; }
  if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = "Sure?";
    setTimeout(function () { btn.textContent = "Clear stack"; delete btn.dataset.sure; }, 4000); return; }
  btn.textContent = "Clear stack"; delete btn.dataset.sure;
  const r = await sb.from("messages").delete().neq("id", 0);
  if (r.error) { sys("could not clear - run the newest sql."); return; }
  byId("sdFeed").innerHTML = "";
  sys("stack cleared - fresh wall.");
}
byId("sdClear").addEventListener("click", function () { clearStack(this); });
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return Array.prototype.map.call(new Uint8Array(b), function (x) { return x.toString(16).padStart(2, "0"); }).join(""); }
byId("sdFeed").addEventListener("click", function (e) { const del = e.target.closest("[data-del]"), ok = e.target.closest("[data-ok]"); if (del) sb.from("messages").delete().eq("id", Number(del.dataset.del)); else if (ok) sb.from("messages").update({approved: true}).eq("id", Number(ok.dataset.ok)); });
byId("sdModGo").addEventListener("click", async function () { const v = (byId("sdMod").value || "").trim().toLowerCase(); if (!v || !joined) { sys("walk in first, then the code."); return; } if (admHash && await sha(v) === admHash) { isMod = true; try { sessionStorage.setItem("sdmod", "1"); } catch (e) {} byId("sdMod").value = ""; byId("sdFeed").innerHTML = ""; loadRecent(); sys("modded up."); } else sys("wrong code."); });
roster([]);
</script>
</body>
</html>
