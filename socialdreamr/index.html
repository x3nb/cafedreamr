<style>
.socialdreamr{--amber:#ffc857;--plum:#0d001a;--ink:#0b0b0e;--lav:#fff0f5;--dim:#7d848b;--line:rgba(255,255,255,.1);--mono:'Space Mono',ui-monospace,Menlo,monospace;max-width:860px;margin:0 auto;padding:22px 14px 40px;color:var(--lav);font-family:var(--mono);text-align:left}
.sdHead{display:flex;align-items:baseline;gap:10px;padding-bottom:4px}
.sdTitle{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:#fff}
.sdHere{font-size:9px;letter-spacing:.1em;color:var(--dim)}
.sdHead button{margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lav);background:transparent;border:1px solid var(--line);border-radius:7px;padding:8px 11px;cursor:pointer}
.sdHead button:hover{border-color:var(--amber);color:#fff}
.sdSub{font-size:9px;letter-spacing:.09em;line-height:1.7;color:var(--dim);padding-bottom:14px}
.sdCard{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));padding:12px;margin-bottom:12px}
.sdRow{display:flex;gap:6px;flex-wrap:wrap}
.sdRow input{flex:1;min-width:0;font-family:var(--mono);font-size:10px;color:var(--lav);outline:none;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;padding:9px 10px}
.sdRow input:focus{border-color:var(--amber)}
.sdRow button,.sdSendRow button{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lav);background:transparent;border:1px solid var(--line);border-radius:7px;padding:9px 12px;cursor:pointer}
.sdRow button:hover,.sdSendRow button:hover{border-color:var(--amber);color:#fff}
.sdRow button:disabled,.sdSendRow button:disabled{opacity:.45;cursor:default}
.sdNote{font-size:8.5px;letter-spacing:.08em;line-height:1.7;color:var(--dim);padding-top:8px}
.sdNote b{color:var(--lav);font-weight:400}
.sdMain{display:grid;grid-template-columns:1fr 170px;gap:10px;margin-bottom:12px}
.sdFeed{height:min(56vh,460px);overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);padding:10px;display:flex;flex-direction:column;gap:10px}
.sdSide{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);padding:10px;max-height:min(56vh,460px);overflow-y:auto}
.sdSideK{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding-bottom:8px}
.sdWho{display:flex;align-items:center;gap:7px;font-size:9px;padding-bottom:8px;overflow-wrap:anywhere}
.sdWho a{color:var(--lav);text-decoration:none;border-bottom:1px solid var(--line)}
.sdWho a:hover{border-color:var(--amber);color:#fff}
.sdWho.stale{opacity:.4}
.sdDot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--cc,#ffc857);box-shadow:0 0 8px var(--cc,#ffc857)}
.sdMsg{display:flex;gap:8px;align-items:flex-start;font-size:9.5px;line-height:1.55;overflow-wrap:anywhere}
.sdMsg .sdDot{margin-top:3px;width:14px;height:14px}
.sdMsg .who{color:var(--cc,#ffc857);text-decoration:none;border-bottom:1px solid transparent}
.sdMsg a.who:hover{border-color:currentColor}
.sdMsg.mine .tx{color:#fff}
.sdMsg .at{color:var(--dim);font-size:8px;margin-left:auto;flex:0 0 auto}
.sdMsg audio{width:100%;height:30px;margin-top:6px;display:block}
.sdTrack{border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-top:6px;background:rgba(255,255,255,.03)}
.sdTrack .tt{font-size:8.5px;letter-spacing:.08em;color:var(--lav);padding-bottom:4px;overflow-wrap:anywhere}
.sdLink{display:block;border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-top:6px;text-decoration:none}
.sdLink:hover{border-color:var(--amber)}
.sdLink .lt{font-size:9px;color:#fff;display:block;overflow-wrap:anywhere}
.sdLink .lu{font-size:8px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdMsg .tx a{color:#c0a6ff}
.sdSys{font-size:8.5px;letter-spacing:.1em;color:var(--dim);text-align:center}
.sdSendRow{display:flex;gap:6px}
.sdSendRow input{flex:1;min-width:0;font-family:var(--mono);font-size:10px;color:var(--lav);outline:none;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;padding:9px 10px}
.sdSendRow input:focus{border-color:var(--amber)}
.sdStage{display:none;align-items:center;gap:8px;font-size:8.5px;letter-spacing:.06em;color:var(--lav);border:1px dashed var(--line);border-radius:8px;padding:7px 9px;margin-bottom:8px;overflow-wrap:anywhere}
.sdStage.on{display:flex}
.sdStage.busy .st{animation:blink 1s infinite}
.sdStage button{margin-left:auto;font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer}
.sdStage button:hover{color:#fff}
@keyframes blink{50%{opacity:.35}}
@media (max-width:640px){.sdMain{grid-template-columns:1fr}.sdSide{max-height:none}#sdRoster{display:flex;gap:12px;overflow-x:auto}.sdWho{flex:0 0 auto;padding-bottom:2px}}
</style>
<div class="socialdreamr">
  <div class="sdHead"><span class="sdTitle">socialdreamr</span><span class="sdHere" id="sdHere"></span><button id="sdCopy" type="button">copy invite</button></div>
  <div class="sdSub">a night lobby for talking and passing tracks around. everyone gets one link — yours shows under everything you say.</div>
  <div class="sdCard">
    <div class="sdRow">
      <input id="sdName" maxlength="24" placeholder="your name" aria-label="your name" autocomplete="off">
      <input id="sdSite" maxlength="200" placeholder="your link — site, social, whatever" aria-label="your link" autocomplete="off" inputmode="url">
      <button id="sdJoin" type="button">walk in</button>
    </div>
    <div class="sdNote" id="sdNote">put your name up and walk in. nothing here leaves this lobby except what you post.</div>
  </div>
  <div class="sdMain">
    <div class="sdFeed" id="sdFeed" aria-live="polite"></div>
    <div class="sdSide"><div class="sdSideK">here now</div><div id="sdRoster"></div></div>
  </div>
  <div class="sdCard">
    <div class="sdStage" id="sdStage"><span class="st" id="sdStageT"></span><button id="sdStageX" type="button">drop it</button></div>
    <div class="sdSendRow">
      <input id="sdText" maxlength="300" placeholder="say something, or paste an mp3 link" aria-label="chat message" autocomplete="off" disabled>
      <button id="sdAttach" type="button" disabled>mp3</button>
      <button id="sdSend" type="button" disabled>send</button>
    </div>
    <input id="sdFile" type="file" accept="audio/mpeg,audio/mp3,.mp3" hidden>
  </div>
</div>
<script type="text/x-server-plugin">
var PEERS = {}, RECENT = [];
function cleanStr(s, n) {
  if (typeof s !== "string") return "";
  return s.trim().slice(0, n);
}
function cleanLink(u, n) {
  if (typeof u !== "string") return "";
  u = u.trim().slice(0, n);
  if (!/^https?:\/\/[^ \t\n<>"]+$/.test(u)) return "";
  return u;
}
function rosterOut() {
  var out = [], t = Date.now(), id;
  for (id in PEERS) {
    if (Date.now() - PEERS[id].seen > 90000) continue;
    out.push({name: PEERS[id].name, site: PEERS[id].site, seen: PEERS[id].seen, t: t});
  }
  return out;
}
function prune() {
  var id, n = 0, changed = false;
  for (id in PEERS) {
    n++;
    if (Date.now() - PEERS[id].seen > 90000) { delete PEERS[id]; changed = true; }
  }
  return changed || n > 0;
}
function publishRoster() {
  pubsub.publish("lobby", JSON.stringify({t: "roster", who: rosterOut()}));
}
self.onopen = function (e) {
  e.conn.subscribe("lobby");
};
self.onmessage = function (e) {
  var msg = null;
  try { msg = JSON.parse(e.data); } catch (err) { return; }
  if (!msg || typeof msg.t !== "string") return;
  var id = e.conn.id, t = Date.now();
  if (msg.t === "hello" || msg.t === "beat") {
    var name = cleanStr(msg.name, 24) || "visitor";
    var site = cleanLink(msg.site, 200);
    var p = PEERS[id];
    if (!p) PEERS[id] = {name: name, site: site, seen: t, lastChat: 0, window: []};
    else { p.name = name; p.site = site; p.seen = t; }
    if (msg.t === "hello") e.conn.send(JSON.stringify({t: "recent", msgs: RECENT}));
    if (msg.t === "hello" || prune()) publishRoster();
    return;
  }
  if (msg.t === "share") {
    var q = PEERS[id];
    if (!q) return;
    if (t - q.lastChat < 1500) return;
    var w = q.window;
    while (w.length && t - w[0] > 10000) w.shift();
    if (w.length >= (e.conn.isProxy ? 3 : 5)) return;
    var text = cleanStr(msg.text, 300);
    var audio = cleanLink(msg.audio, 2000);
    var atitle = cleanStr(msg.atitle, 80);
    var link = cleanLink(msg.link, 500);
    var ltitle = cleanStr(msg.ltitle, 80);
    if (!text && !audio && !link) return;
    q.lastChat = t; w.push(t); q.seen = t;
    var out = {t: "msg", name: q.name, site: q.site, text: text, audio: audio, atitle: atitle, link: link, ltitle: ltitle, at: t};
    RECENT.push(out);
    if (RECENT.length > 30) RECENT.shift();
    pubsub.publish("lobby", JSON.stringify(out));
  }
};
self.onclose = function (e) {
  if (PEERS[e.conn.id]) { delete PEERS[e.conn.id]; publishRoster(); }
};
</script>
<script>
(function () {
  "use strict";
  function byId(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  function toast(s) {
    var f = byId("sdFeed"), d = document.createElement("div");
    d.className = "sdSys"; d.textContent = s;
    f.appendChild(d);
    while (f.children.length > 60) f.removeChild(f.firstChild);
    f.scrollTop = f.scrollHeight;
  }
  function hue(name) {
    var h = 0, s = name || "";
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    var stops = ["#ffc857", "#ff2d95", "#00e5ff", "#ccff00", "#bf40bf", "#98fb98", "#6495ed", "#ffb8d9"];
    return stops[(h >>> 0) % stops.length];
  }
  function linkify(s) {
    var parts = String(s).split(/(https?:\/\/[^\s<>"]+)/g), out = "";
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<a href="' + esc(parts[i]) + '" target="_blank" rel="noopener noreferrer">' + esc(parts[i]) + "</a>";
      else out += esc(parts[i]);
    }
    return out;
  }
  function mp3url(s) {
    var m = /https?:\/\/[^\s<>"]+?\.mp3(\?[^\s<>"]*)?/i.exec(String(s));
    return m ? m[0] : "";
  }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function myName() { return (byId("sdName").value || "").trim().slice(0, 24) || "visitor"; }
  function mySite() {
    var v = (byId("sdSite").value || "").trim().slice(0, 200);
    if (v && !/^https?:\/\//i.test(v)) v = "https://" + v;
    return /^https?:\/\/[^ \t\n<>"]+$/.test(v) ? v : "";
  }
  var sock = null, beatT = 0, backoff = 1000, want = false, staged = null;
  function whoHtml(name, site) {
    var cc = hue(name);
    if (site) return '<a class="who" style="--cc:' + cc + '" href="' + esc(site) + '" target="_blank" rel="noopener noreferrer">' + esc(name) + "</a>";
    return '<span class="who" style="--cc:' + cc + '">' + esc(name) + "</span>";
  }
  function msgHtml(m) {
    var cc = hue(m.name), at = "";
    try { at = new Date(m.at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); } catch (e) {}
    var h = '<span class="sdDot" style="--cc:' + cc + '"></span><span><span>' + whoHtml(m.name, m.site) + "</span>";
    if (m.text) {
      var found = mp3url(m.text);
      if (found && m.text.trim() === found.trim()) h += '<div class="sdTrack"><div class="tt">' + esc(m.atitle || found.split("/").pop().split("?")[0] || "track") + '</div><audio controls preload="none" src="' + esc(found) + '"></audio></div>';
      else {
        h += ' <span class="tx">' + linkify(m.text) + "</span>";
        if (found) h += '<div class="sdTrack"><div class="tt">track</div><audio controls preload="none" src="' + esc(found) + '"></audio></div>';
      }
    }
    if (m.audio) h += '<div class="sdTrack"><div class="tt">' + esc(m.atitle || "track") + '</div><audio controls preload="none" src="' + esc(m.audio) + '"></audio></div>';
    if (m.link) h += '<a class="sdLink" href="' + esc(m.link) + '" target="_blank" rel="noopener noreferrer"><span class="lt">' + esc(m.ltitle || m.link) + '</span><span class="lu">' + esc(m.link) + "</span></a>";
    h += "</span>" + '<span class="at">' + esc(at) + "</span>";
    return h;
  }
  function addMsg(m, mine) {
    var f = byId("sdFeed"), near = f.scrollHeight - f.scrollTop - f.clientHeight < 60;
    var d = document.createElement("div");
    d.className = "sdMsg" + (mine ? " mine" : "");
    d.innerHTML = msgHtml(m);
    f.appendChild(d);
    while (f.children.length > 60) f.removeChild(f.firstChild);
    if (mine || near) f.scrollTop = f.scrollHeight;
  }
  function roster(who) {
    var t = Date.now(), r = byId("sdRoster");
    r.innerHTML = (who || []).map(function (p) {
      var stale = (t - p.seen > 75000) ? " stale" : "", cc = hue(p.name);
      var nm = p.site ? '<a href="' + esc(p.site) + '" target="_blank" rel="noopener noreferrer">' + esc(p.name) + "</a>" : esc(p.name);
      return '<div class="sdWho' + stale + '"><span class="sdDot" style="--cc:' + cc + '"></span><span>' + nm + "</span></div>";
    }).join("") || '<div class="sdWho">quiet in here</div>';
    byId("sdHere").textContent = (who || []).length ? (who || []).length + " here" : "";
  }
  function setOpen(open) {
    byId("sdText").disabled = !open;
    byId("sdAttach").disabled = !open;
    byId("sdSend").disabled = !open;
    byId("sdJoin").textContent = open ? "step out" : "walk in";
  }
  function sendObj(o) { if (sock) { try { sock.send(JSON.stringify(o)); } catch (e) {} } }
  function hello() { sendObj({t: "hello", name: myName(), site: mySite()}); }
  function beat() { sendObj({t: "beat", name: myName(), site: mySite()}); }
  function join() {
    var mk = null;
    try { mk = (typeof root !== "undefined" && root && typeof root.createServerSocket === "function") ? root.createServerSocket() : null; } catch (e) { mk = null; }
    if (!mk) {
      byId("sdNote").innerHTML = "this lobby only talks on its <b>perchance page</b> — this copy is standing outside.";
      return;
    }
    sock = mk; want = true;
    try { sock.binaryType = "arraybuffer"; } catch (e) {}
    sock.addEventListener("open", function () {
      backoff = 1000; hello();
      if (beatT) clearInterval(beatT);
      beatT = setInterval(beat, 20000);
      setOpen(true);
      toast("you walked in as " + myName());
    });
    sock.addEventListener("message", function (ev) {
      var m = null;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m) return;
      if (m.t === "msg") addMsg(m, m.name === myName());
      else if (m.t === "roster") roster(m.who);
      else if (m.t === "recent") (m.msgs || []).forEach(function (x) { addMsg(x, x.name === myName()); });
    });
    sock.addEventListener("close", function (ev) {
      if (beatT) { clearInterval(beatT); beatT = 0; }
      setOpen(false); sock = null;
      if (ev && ev.code === 4403) {
        byId("sdNote").innerHTML = "this lobby only talks on its <b>perchance page</b> — this copy is standing outside.";
        want = false; return;
      }
      if (!want) return;
      var wait = backoff + Math.floor(Math.random() * 800);
      backoff = Math.min(30000, backoff * 2);
      toast("the line dropped · trying again");
      setTimeout(function () { if (want) join(); }, wait);
    });
  }
  function leave() {
    want = false;
    if (beatT) { clearInterval(beatT); beatT = 0; }
    if (sock) { try { sock.close(1000, "out"); } catch (e) {} sock = null; }
    setOpen(false); toast("you stepped out");
  }
  function stageBusy(label) {
    var s = byId("sdStage");
    s.classList.add("on"); s.classList.add("busy");
    byId("sdStageT").textContent = label;
  }
  function stageTrack(title) {
    var s = byId("sdStage");
    s.classList.add("on"); s.classList.remove("busy");
    byId("sdStageT").textContent = "track ready: " + title;
  }
  function stageClear() {
    staged = null;
    byId("sdStage").classList.remove("on", "busy");
  }
  function sendIt() {
    var v = (byId("sdText").value || "").trim().slice(0, 300);
    if ((!v && !staged) || !sock) return;
    var o = {t: "share", text: v};
    if (staged) { o.audio = staged.url; o.atitle = staged.title; }
    sendObj(o);
    byId("sdText").value = ""; stageClear();
  }
  var sn = load("sdName"), ss = load("sdSite");
  if (sn) byId("sdName").value = sn;
  if (ss) byId("sdSite").value = ss;
  byId("sdName").addEventListener("change", function () { store("sdName", byId("sdName").value); beat(); });
  byId("sdSite").addEventListener("change", function () { store("sdSite", byId("sdSite").value); beat(); });
  byId("sdJoin").addEventListener("click", function () { if (sock) leave(); else join(); });
  byId("sdSend").addEventListener("click", sendIt);
  byId("sdText").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); sendIt(); } });
  byId("sdStageX").addEventListener("click", stageClear);
  byId("sdAttach").addEventListener("click", function () { byId("sdFile").click(); });
  byId("sdFile").addEventListener("change", function () {
    var f = byId("sdFile").files && byId("sdFile").files[0];
    byId("sdFile").value = "";
    if (!f || !sock) return;
    var okType = (f.type || "").indexOf("audio/") === 0 || /\.mp3$/i.test(f.name || "");
    if (!okType) { toast("mp3s only for the decks."); return; }
    if (f.size > 24 * 1024 * 1024) { toast("too big — keep it under ~24mb."); return; }
    var title = (f.name || "track").replace(/\.[^.]*$/, "").slice(0, 80) || "track";
    stageBusy("lifting " + title + " …");
    var up = null;
    try { up = (typeof root !== "undefined" && root && root.uploadPlugin) ? root.uploadPlugin : null; } catch (e) { up = null; }
    if (!up) { toast("uploads aren't awake here — paste an mp3 link instead."); stageClear(); return; }
    up(f).then(function (r) {
      if (!r || r.error || !r.url) {
        toast(r && r.error === "file_too_big" ? "too big — keep it under ~24mb." : r && r.error === "over_daily_allowance" ? "the decks are full today — try later." : "that file wouldn't lift — try again.");
        stageClear(); return;
      }
      staged = {url: r.url, title: title};
      stageTrack(title);
    }, function () { toast("that file wouldn't lift — try again."); stageClear(); });
  });
  byId("sdCopy").addEventListener("click", function () {
    var link = "https://perchance.org/" + (window.generatorName || "") + "";
    var done = function () { toast("invite copied — pass it on."); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { toast(link); });
    else toast(link);
  });
  try {
    if (window.generatorIsUnsaved) byId("sdNote").innerHTML = "put your name up and walk in. <b>rehearsal:</b> only this tab can hear you until the generator is saved.";
  } catch (e) {}
  roster([]);
})();
</script>
