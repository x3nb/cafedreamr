<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Chat Lounge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f051d;
      color: #e0d8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* MAIN CONTAINER & SIDEBAR LAYOUT */
    .chat-container {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 850px;
    }

    .chat-card {
      flex: 1;
      background: #15092b;
      border: 1px solid #32165c;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #32165c;
      padding-bottom: 10px;
    }

    button.mini {
      background: #2a114d;
      border: 1px solid #5a299d;
      color: #e0d8f0;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    button.mini:hover {
      background: #bf40bf;
      color: #fff;
    }

    /* AVATAR SELECTOR */
    .avatar-selector {
      display: flex;
      gap: 8px;
    }

    .avatar-opt {
      font-size: 20px;
      padding: 6px;
      border: 1px solid #32165c;
      border-radius: 6px;
      background: #1c0c38;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .avatar-opt.selected {
      border-color: #00e5ff;
      background: #bf40bf;
      box-shadow: 0 0 8px #00e5ff;
    }

    /* CHAT BOX & MESSAGES */
    #chatBox {
      height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
    }

    .msg-item {
      position: relative;
      background: #1c0c38;
      border: 1px solid #2e145b;
      border-radius: 6px;
      padding: 8px 28px 8px 12px; /* Extra right padding for X button */
    }

    .msg-close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: transparent;
      border: none;
      color: #a08cc0;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      padding: 2px;
      border-radius: 3px;
      transition: all 0.15s ease;
    }

    .msg-close:hover {
      color: #ff4d4d;
      background: rgba(255, 77, 77, 0.1);
    }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-avatar {
      font-size: 16px;
      line-height: 1;
    }

    .msg-user {
      font-size: 12px;
      color: #00e5ff;
      font-weight: bold;
    }

    .msg-text {
      margin-top: 4px;
      font-size: 14px;
    }

    /* EMOJI REACTIONS BAR */
    .sdReactions {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .sdReactionBtn {
      background: #1e0d36;
      border: 1px solid #4a2875;
      color: #e0d8f0;
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .sdReactionBtn:hover {
      background: #bf40bf;
      border-color: #00e5ff;
      color: #fff;
    }

    /* TYPING INDICATOR */
    .sdTyping {
      font-size: 11px;
      color: #bf40bf;
      min-height: 16px;
      margin: 2px 0 2px 4px;
      font-style: italic;
    }

    .sdTyping span {
      animation: blink 1.4s infinite both;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      20% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    /* INPUT ROW */
    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #0d0418;
      border: 1px solid #32165c;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
    }

    input[type="text"]:focus {
      outline: 1px solid #bf40bf;
    }

    /* SIDEBAR STYLES */
    .online-sidebar {
      width: 200px;
      background: #15092b;
      border: 1px solid #32165c;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-header {
      font-size: 14px;
      font-weight: bold;
      color: #bf40bf;
      border-bottom: 1px solid #32165c;
      padding-bottom: 8px;
    }

    .user-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 380px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #e0d8f0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 6px #00e5ff;
    }

    .user-item .user-avatar {
      font-size: 14px;
    }

    .user-item.is-me {
      font-weight: bold;
      color: #bf40bf;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-card">
      <header>
        <h2>Lounge Chat</h2>
        <div class="avatar-selector" id="avatarSelector">
          <button class="avatar-opt selected" onclick="selectAvatar('👾')">👾</button>
          <button class="avatar-opt" onclick="selectAvatar('🤖')">🤖</button>
          <button class="avatar-opt" onclick="selectAvatar('🐱')">🐱</button>
          <button class="avatar-opt" onclick="selectAvatar('🦊')">🦊</button>
          <button class="avatar-opt" onclick="selectAvatar('🚀')">🚀</button>
        </div>
        <button class="mini" id="sdCrackle">Vinyl</button>
      </header>

      <div id="chatBox"></div>

      <!-- TYPING INDICATOR DISPLAY -->
      <div id="sdTypingIndicator" class="sdTyping"></div>

      <div class="input-row">
        <input type="text" id="msgInput" placeholder="Type a message..." />
        <button class="mini" id="sendBtn">Send</button>
      </div>
    </div>

    <!-- ONLINE USERS SIDEBAR -->
    <aside class="online-sidebar">
      <div class="sidebar-header">
        Online Users (<span id="onlineCount">0</span>)
      </div>
      <ul id="onlineUsersList" class="user-list"></ul>
    </aside>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // Replace with your actual Supabase credentials
    const SUPABASE_URL = "https://your-supabase-url.supabase.co";
    const SUPABASE_KEY = "your-anon-key";
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    let myUsername = "User_" + Math.floor(Math.random() * 1000);
    let myAvatar = "👾";
    const EMOJI_LIST = ["🔥", "☕", "🔊", "✨", "💜"];
    const emojiCounts = {};
    const onlineUsers = new Map();

    function myName() { return myUsername; }

    // --- 1. AVATAR SELECTION --- //
    window.selectAvatar = function(emoji) {
      myAvatar = emoji;
      document.querySelectorAll(".avatar-opt").forEach(btn => {
        btn.classList.toggle("selected", btn.textContent.trim() === emoji);
      });

      if (presenceChannel) {
        presenceChannel.track({
          username: myName(),
          avatar: myAvatar,
          isTyping: isCurrentlyTyping
        });
      }
    };

    // --- 2. WEB AUDIO VINYL CRACKLE --- //
    let audioCtx = null;
    let crackleNode = null;
    let crackleGain = null;
    let isCracklePlaying = false;

    function initVinylCrackle() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        if (Math.random() < 0.0012) {
          data[i] = (Math.random() * 2 - 1) * 0.7;
        } else if (Math.random() < 0.005) {
          data[i] = (Math.random() * 2 - 1) * 0.25;
        } else {
          data[i] = 0;
        }
      }

      crackleNode = audioCtx.createBufferSource();
      crackleNode.buffer = buffer;
      crackleNode.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 3000;

      crackleGain = audioCtx.createGain();
      crackleGain.gain.value = 0.08;

      crackleNode.connect(filter);
      filter.connect(crackleGain);
      crackleGain.connect(audioCtx.destination);

      crackleNode.start();
      isCracklePlaying = true;
    }

    function toggleVinylCrackle() {
      if (!audioCtx) {
        initVinylCrackle();
        return;
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
        isCracklePlaying = true;
      } else if (isCracklePlaying) {
        crackleGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        isCracklePlaying = false;
      } else {
        crackleGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.1);
        isCracklePlaying = true;
      }
    }

    document.getElementById("sdCrackle").addEventListener("click", toggleVinylCrackle);

    // --- 3. EMOJI REACTIONS LOGIC --- //
    window.reactToMsg = async function(msgId, emoji) {
      const { error } = await sb.from("message_reactions").insert({
        message_id: msgId,
        emoji: emoji,
        voter_name: myName()
      });
      if (!error) {
        if (!emojiCounts[msgId]) emojiCounts[msgId] = {};
        emojiCounts[msgId][emoji] = (emojiCounts[msgId][emoji] || 0) + 1;
        updateReactionsUI();
      }
    };

    async function loadReactions() {
      const { data, error } = await sb.from("message_reactions").select("message_id, emoji");
      if (error) return;

      for (const k in emojiCounts) delete emojiCounts[k];
      (data || []).forEach(row => {
        if (!emojiCounts[row.message_id]) emojiCounts[row.message_id] = {};
        emojiCounts[row.message_id][row.emoji] = (emojiCounts[row.message_id][row.emoji] || 0) + 1;
      });
      updateReactionsUI();
    }

    function updateReactionsUI() {
      for (const msgId in emojiCounts) {
        for (const emoji of EMOJI_LIST) {
          const badge = document.getElementById(`react-${msgId}-${emoji}`);
          const count = emojiCounts[msgId][emoji] || 0;
          if (badge) badge.textContent = count > 0 ? ` ${count}` : "";
        }
      }
    }

    function renderReactionsBar(msgId) {
      const msgReactions = emojiCounts[msgId] || {};
      let html = `<div class="sdReactions">`;
      EMOJI_LIST.forEach(emoji => {
        const count = msgReactions[emoji] || 0;
        const countSpan = count > 0 ? ` ${count}` : "";
        html += `<button class="sdReactionBtn" onclick="reactToMsg(${msgId}, '${emoji}')">${emoji}<span id="react-${msgId}-${emoji}">${countSpan}</span></button>`;
      });
      html += `</div>`;
      return html;
    }

    // --- 4. MESSAGE RENDERING & DELETION --- //
    window.deleteMessage = async function(msgId) {
      if (typeof sb !== 'undefined') {
        await sb.from('messages').delete().eq('id', msgId);
      }
      const msgEl = document.getElementById(`msg-${msgId}`);
      if (msgEl) msgEl.remove();
    };

    function renderMessage(m) {
      const avatar = m.avatar || "👾"; 

      return `
        <div class="msg-item" id="msg-${m.id}">
          <button class="msg-close" onclick="deleteMessage(${m.id})">&times;</button>
          <div class="msg-header">
            <span class="msg-avatar">${avatar}</span>
            <span class="msg-user">${m.user_name}</span>
          </div>
          <div class="msg-text">${m.content}</div>
          ${renderReactionsBar(m.id)}
        </div>
      `;
    }

    // --- 5. REALTIME PRESENCE, ONLINE USERS & TYPING INDICATOR --- //
    let presenceChannel = null;
    let typingTimeout = null;
    let isCurrentlyTyping = false;
    const typingUsers = new Set();

    function initPresenceChannel() {
      if (presenceChannel) return;

      presenceChannel = sb.channel('room-presence', {
        config: { presence: { key: myName() } }
      });

      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          const state = presenceChannel.presenceState();
          
          typingUsers.clear();
          onlineUsers.clear();

          for (const id in state) {
            const userPresence = state[id][0];
            if (userPresence) {
              onlineUsers.set(id, userPresence);
            }

            state[id].forEach(user => {
              if (user.isTyping && user.username !== myName()) {
                typingUsers.add(user.username);
              }
            });
          }

          renderTypingIndicator();
          renderOnlineUsers();
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await presenceChannel.track({
              username: myName(),
              avatar: myAvatar,
              isTyping: false
            });
          }
        });
    }

    function renderOnlineUsers() {
      const listEl = document.getElementById("onlineUsersList");
      const countEl = document.getElementById("onlineCount");
      if (!listEl || !countEl) return;

      countEl.textContent = onlineUsers.size;
      listEl.innerHTML = "";

      onlineUsers.forEach((user, username) => {
        const li = document.createElement("li");
        li.className = `user-item ${username === myName() ? "is-me" : ""}`;
        const userAvatar = user.avatar || "👾";
        
        li.innerHTML = `
          <span class="status-dot"></span>
          <span class="user-avatar">${userAvatar}</span>
          <span class="user-name">${username}${username === myName() ? " (You)" : ""}</span>
        `;
        
        listEl.appendChild(li);
      });
    }

    function renderTypingIndicator() {
      const el = document.getElementById("sdTypingIndicator");
      if (!el) return;
      const users = Array.from(typingUsers);

      if (users.length === 0) el.innerHTML = "";
      else if (users.length === 1) el.innerHTML = `${users[0]} is typing<span>...</span>`;
      else if (users.length === 2) el.innerHTML = `${users[0]} and ${users[1]} are typing<span>...</span>`;
      else el.innerHTML = `Several people are typing<span>...</span>`;
    }

    async function setTypingState(typing) {
      if (isCurrentlyTyping === typing || !presenceChannel) return;
      isCurrentlyTyping = typing;
      await presenceChannel.track({
        username: myName(),
        avatar: myAvatar,
        isTyping: typing
      });
    }

    function handleTypingEvent() {
      setTypingState(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        setTypingState(false);
      }, 2000);
    }

    const inputEl = document.getElementById("msgInput");
    inputEl.addEventListener("input", handleTypingEvent);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        clearTimeout(typingTimeout);
        setTypingState(false);
      }
    });

    // Initialize
    initPresenceChannel();
    loadReactions();
  </script>
</body>
</html>
