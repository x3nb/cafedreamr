<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The L'Aube Handover</title>
    <style>
        :root {
            --laube-bg: #ffffff;
            --laube-text: #1a1a1a;
            --amber: #ffca28;
            --coffee: #5d4037;
            --milk: #fcfcfc;
        }

        body {
            margin: 0; background: var(--laube-bg); color: var(--laube-text);
            font-family: 'Helvetica Neue', sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            perspective: 1200px;
        }

        /* --- STAGE & VESSEL --- */
        #stage {
            width: 300px; height: 300px;
            display: flex; align-items: flex-end; justify-content: center;
            position: relative; transition: transform 1.5s ease;
        }
        .tilt-forward { transform: rotateX(35deg) translateY(-40px); }

        #vessel {
            width: 120px; height: 100px; background: #fff; border: 2px solid #1a1a1a;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; overflow: hidden; z-index: 10;
        }

        /* Shaped Liquid */
        .liquid-base {
            position: absolute; bottom: 0; width: 100%; height: 0%;
            border-bottom-left-radius: 35px; border-bottom-right-radius: 35px;
            transition: height 3s ease, background-color 1s;
        }

        #milk-top {
            position: absolute; top: 0; width: 100%; height: 0%;
            background: var(--milk); transition: height 1.5s ease;
            opacity: 0.9;
        }

        /* --- THE STIRRING SPOON --- */
        #spoon {
            position: absolute; top: 20%; left: 50%; width: 4px; height: 80px;
            background: #ccc; border: 1px solid #999; display: none;
            transform-origin: top center; z-index: 20;
        }
        .stirring { animation: stir-motion 0.5s infinite linear; }
        @keyframes stir-motion {
            0% { transform: translateX(-50%) rotate(0deg) translateX(10px) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg) translateX(10px) rotate(-360deg); }
        }

        /* --- HELD CUP CURSOR --- */
        #held-cup {
            position: fixed; width: 70px; height: 60px;
            background: #fff; border: 2px solid #1a1a1a;
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;
            pointer-events: none; display: none; z-index: 9999;
            transform: translate(-50%, -50%);
        }
        #held-liquid {
            position: absolute; bottom: 0; width: 100%; height: 85%;
            background: var(--amber); border-bottom-left-radius: 22px; border-bottom-right-radius: 22px;
        }

        /* --- UI PANEL --- */
        #ui { margin-top: 40px; text-align: center; max-width: 400px; }
        .row { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        button {
            padding: 10px 15px; border: 1px solid #ccc; background: #fff;
            font-size: 0.7rem; cursor: pointer; letter-spacing: 1px;
        }
        button.active { border-color: #000; background: #f4f4f4; font-weight: bold; }
        #main-action { background: #000; color: #fff; width: 100%; border: none; padding: 15px; margin-top: 10px; }

        /* --- SOUND TOGGLE --- */
        #sound-toggle {
            display: block; margin: 22px auto 0; padding: 4px 2px; border: none;
            background: none; color: inherit; font-family: inherit; font-size: 0.6rem;
            letter-spacing: 2px; opacity: 0.45; cursor: pointer;
        }
        #sound-toggle:hover { opacity: 1; }

        .hidden { display: none; }
        .holding { cursor: none !important; }
    </style>
</head>
<body id="b">

    <div id="stage">
        <div id="spoon"></div>
        <div id="vessel" onclick="grab()">
            <div id="liquid" class="liquid-base">
                <div id="milk-top"></div>
            </div>
        </div>
    </div>

    <div id="held-cup">
        <div id="held-liquid"></div>
    </div>

    <div id="ui">
        <div id="menu">
            <div class="row">
                <button id="b-tea" class="active" onclick="setBase('tea')">Imperial_Tea</button>
                <button id="b-coffee" onclick="setBase('coffee')">Black_Coffee</button>
            </div>
            <div class="row">
                <button id="b-milk" onclick="toggleMilk()">[ + Add_Milk ]</button>
            </div>
            <button id="main-action" onclick="startRitual()">BEGIN_STEEP</button>
        </div>
        <p id="status" style="font-size: 0.6rem; margin-top: 20px; opacity: 0.5; letter-spacing: 2px;">READY_FOR_SELECTION</p>
        <button id="sound-toggle" type="button" aria-pressed="true">SOUND_ON</button>
    </div>

    <script>
        /* =================================================================
           SOUND
           A tiny synth, in the same idiom as the rest of the realm (PLAY's
           beep()): oscillators + filtered noise, low gain, woken on the
           first gesture so the browser never blocks it. Every sound is a
           function of the graph it draws into, so the palette can also be
           rendered offline and checked without speakers.
           ================================================================= */

        function mkGraph(ctx, out) {
            /* every voice holds its level and then releases, rather than
               decaying from the first millisecond — a pour has to keep
               pouring while the vessel is still filling */
            function shape(g, t0, dur, vol, o) {
                var attack = (o.attack == null ? Math.min(0.015, dur * 0.3) : o.attack);
                var release = (o.release == null ? Math.min(dur * 0.6, 0.8) : o.release);
                var hold = Math.max(t0 + attack, t0 + dur - release);
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
                g.gain.setValueAtTime(vol, hold);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            }

            function tone(freq, dur, o) {
                o = o || {};
                var t0 = ctx.currentTime + (o.at || 0);
                var osc = ctx.createOscillator(), g = ctx.createGain();
                osc.type = o.type || "sine";
                osc.frequency.setValueAtTime(freq, t0);
                if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + dur);
                shape(g, t0, dur, (o.vol == null ? 0.05 : o.vol), o);
                osc.connect(g); g.connect(out);
                osc.start(t0); osc.stop(t0 + dur + 0.04);
            }

            var buf = null;
            function noise(dur, o) {
                o = o || {};
                if (!buf) {
                    var n = Math.floor(ctx.sampleRate * 1.5);
                    buf = ctx.createBuffer(1, n, ctx.sampleRate);
                    var d = buf.getChannelData(0);
                    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
                }
                var t0 = ctx.currentTime + (o.at || 0);
                var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
                var f = ctx.createBiquadFilter();
                f.type = o.filter || "bandpass";
                f.frequency.setValueAtTime(o.from || 900, t0);
                if (o.to) {
                    if (o.sweep === "linear") f.frequency.linearRampToValueAtTime(Math.max(40, o.to), t0 + dur);
                    else f.frequency.exponentialRampToValueAtTime(Math.max(40, o.to), t0 + dur);
                }
                f.Q.value = (o.q == null ? 1.1 : o.q);
                var g = ctx.createGain();
                shape(g, t0, dur, (o.vol == null ? 0.05 : o.vol), o);
                src.connect(f); f.connect(g); g.connect(out);
                src.start(t0, Math.random() * 0.9); src.stop(t0 + dur + 0.03);
            }

            return { tone: tone, noise: noise };
        }

        /* one sound per step of the ritual */
        var SFX = {
            /* the buttons: a dry ceramic tick — tea lighter than coffee */
            pick: function (g, kind) {
                var f = (kind === "coffee") ? 820 : 1240;
                g.noise(0.028, { filter: "highpass", from: 3200, vol: 0.03 });
                g.tone(f, 0.06, { type: "triangle", vol: 0.05 });
                g.tone(f * 2, 0.03, { vol: 0.012, at: 0.004 });
            },
            /* milk into the jug, and back out of it */
            milkOn: function (g) {
                g.noise(0.3, { filter: "bandpass", from: 700, to: 1500, q: 0.8, vol: 0.035, attack: 0.04 });
                g.tone(430, 0.3, { to: 620, vol: 0.02 });
            },
            milkOff: function (g) {
                g.tone(560, 0.1, { to: 320, type: "triangle", vol: 0.035 });
            },
            /* BEGIN_STEEP: the relay closes and the element comes up */
            begin: function (g) {
                g.noise(0.05, { filter: "highpass", from: 2200, vol: 0.035 });
                g.tone(96, 0.6, { to: 168, vol: 0.05 });
                g.noise(0.7, { filter: "lowpass", from: 380, to: 1400, vol: 0.028, attack: 0.2 });
            },
            /* the pour — a hiss that drops as the vessel fills (3 s, to match the fill) */
            pour: function (g, base) {
                var dark = (base === "coffee");
                g.noise(2.9, { filter: "bandpass", from: dark ? 1150 : 1500, to: dark ? 430 : 560, q: 0.7, vol: 0.05, attack: 0.12, release: 0.55, sweep: "linear" });
                g.noise(2.9, { filter: "highpass", from: 3800, q: 0.5, vol: 0.012, attack: 0.12, release: 0.55 });
                g.tone(dark ? 130 : 152, 2.9, { to: 96, vol: 0.018, attack: 0.12, release: 0.55 });
                g.tone(880, 0.16, { to: 480, vol: 0.03, at: 0.05 });
                g.tone(760, 0.18, { to: 400, vol: 0.025, at: 0.3 });
            },
            /* milk breaking the surface */
            drip: function (g) {
                g.tone(940, 0.13, { to: 430, vol: 0.05 });
                g.tone(880, 0.15, { to: 400, vol: 0.045, at: 0.24 });
                g.tone(1010, 0.11, { to: 460, vol: 0.035, at: 0.46 });
            },
            /* the spoon set down in the vessel */
            cue: function (g) {
                g.tone(2050, 0.045, { type: "triangle", vol: 0.05 });
                g.noise(0.025, { filter: "highpass", from: 4200, vol: 0.045 });
                g.tone(2050, 0.045, { type: "triangle", vol: 0.04, at: 0.11 });
                g.noise(0.025, { filter: "highpass", from: 4200, vol: 0.036, at: 0.11 });
            },
            /* two seconds of stirring — one swish per half turn of the spoon */
            stir: function (g) {
                for (var i = 0; i < 8; i++) {
                    var t = i * 0.25, out = (i % 2 === 0);
                    g.noise(0.13, { filter: "bandpass", from: out ? 420 : 760, to: out ? 900 : 520, q: 0.6, vol: 0.055, attack: 0.03, at: t });
                    g.noise(0.13, { filter: "highpass", from: 3200, q: 0.5, vol: 0.012, attack: 0.03, at: t });
                    g.tone(1560, 0.022, { type: "triangle", vol: 0.012, at: t });
                }
            },
            /* RITUAL_COMPLETE — three warm notes, the handover */
            done: function (g) {
                var notes = [587.33, 739.99, 880];
                for (var i = 0; i < 3; i++) {
                    var at = i * 0.13;
                    g.tone(notes[i], 1.5 - i * 0.15, { vol: 0.05, at: at });
                    g.tone(notes[i] * 2, 0.9 - i * 0.1, { vol: 0.014, at: at });
                    g.tone(notes[i] / 2, 1.6, { type: "triangle", vol: 0.016, at: at });
                }
                g.noise(0.5, { filter: "highpass", from: 5200, vol: 0.008, attack: 0.05 });
            },
            /* the cup comes off the machine */
            lift: function (g) {
                g.noise(0.34, { filter: "highpass", from: 900, to: 2800, vol: 0.032, attack: 0.07 });
                g.tone(1320, 0.06, { type: "triangle", vol: 0.035, at: 0.4 });
                g.noise(0.03, { filter: "highpass", from: 3600, vol: 0.025, at: 0.4 });
            }
        };

        var actx = null, live = null, soundOn = true;
        var SOUND_KEY = "cd_coffeemaker_sound";

        function graph() {
            if (!live) {
                var Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return null;
                actx = new Ctx();
                live = mkGraph(actx, actx.destination);
            }
            if (actx.state === "suspended" && actx.resume) actx.resume();
            return live;
        }

        function sfx(name, arg) {
            if (!soundOn) return;
            try { var g = graph(); if (g) SFX[name](g, arg); } catch (e) {}
        }

        var soundToggle = document.getElementById("sound-toggle");
        function paintToggle() {
            soundToggle.textContent = soundOn ? "SOUND_ON" : "SOUND_OFF";
            soundToggle.setAttribute("aria-pressed", soundOn ? "true" : "false");
        }
        soundToggle.addEventListener("click", function () {
            soundOn = !soundOn;
            paintToggle();
            try { localStorage.setItem(SOUND_KEY, soundOn ? "1" : "0"); } catch (e) {}
            if (soundOn) sfx("pick", "tea");
        });
        try { if (localStorage.getItem(SOUND_KEY) === "0") soundOn = false; } catch (e) {}
        paintToggle();

        /* =================================================================
           THE RITUAL
           ================================================================= */

        let state = { base: 'tea', milk: false, stirred: false, ritualActive: false };
        const liquid = document.getElementById('liquid');
        const milk = document.getElementById('milk-top');
        const spoon = document.getElementById('spoon');
        const status = document.getElementById('status');

        function setBase(type) {
            if(state.ritualActive) return;
            state.base = type;
            document.getElementById('b-tea').classList.toggle('active', type === 'tea');
            document.getElementById('b-coffee').classList.toggle('active', type === 'coffee');
            sfx('pick', type);
        }

        function toggleMilk() {
            if(state.ritualActive) return;
            state.milk = !state.milk;
            document.getElementById('b-milk').classList.toggle('active', state.milk);
            sfx(state.milk ? 'milkOn' : 'milkOff');
        }

        function startRitual() {
            state.ritualActive = true;
            document.getElementById('menu').classList.add('hidden');
            status.innerText = "POURING_BASE...";
            sfx('begin');
            sfx('pour', state.base);

            // Fill Base
            liquid.style.backgroundColor = state.base === 'tea' ? 'var(--amber)' : 'var(--coffee)';
            liquid.style.height = state.milk ? "70%" : "85%";

            // Add Milk
            if(state.milk) {
                setTimeout(() => {
                    status.innerText = "ADDING_MILK...";
                    sfx('drip');
                    milk.style.height = "25%";
                }, 3500);
            }

            // Stirring Phase
            setTimeout(() => {
                status.innerText = "STIRRING_REQUIRED (CLICK_CUP)";
                spoon.style.display = "block";
                sfx('cue');

                // Clicking the cup now stirs it
                document.getElementById('vessel').onclick = function() {
                    spoon.classList.add('stirring');
                    status.innerText = "MIXING_FLAVORS...";
                    sfx('stir');

                    setTimeout(() => {
                        spoon.style.display = "none";
                        // Blend the colors
                        liquid.style.backgroundColor = state.base === 'tea' ? '#e3b448' : '#8d6e63';
                        milk.style.height = "0%";
                        finishRitual();
                    }, 2000);
                };
            }, state.milk ? 5500 : 3500);
        }

        function finishRitual() {
            status.innerText = "RITUAL_COMPLETE. RECEIVE_DRINK.";
            sfx('done');
            document.getElementById('stage').classList.add('tilt-forward');
            document.getElementById('vessel').onclick = grab;
        }

        function grab() {
            if(!document.getElementById('stage').classList.contains('tilt-forward')) return;

            sfx('lift');
            document.getElementById('b').classList.add('holding');
            document.getElementById('vessel').style.visibility = 'hidden';
            document.getElementById('ui').style.opacity = '0';

            const held = document.getElementById('held-cup');
            const heldLiq = document.getElementById('held-liquid');

            heldLiq.style.backgroundColor = liquid.style.backgroundColor;
            held.style.display = 'block';

            window.addEventListener('mousemove', (e) => {
                held.style.left = e.clientX + 'px';
                held.style.top = e.clientY + 'px';
            });
        }
    </script>
</body>
</html>
