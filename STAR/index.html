<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --plum:#0d001a; --ink:#0b0b0e; --ink2:#141419; --ink3:#1b1b22;
  --lime:#ccff00; --pink:#ff2d95; --cyan:#00e5ff;
  --violet:#bf40bf; --violet2:#ee82ee; --corn:#6495ed; --mint:#98fb98;
  --cream:#e9e6de; --lav:#fff0f5; --dim:#7d848b;
  --line:rgba(255,255,255,.10);
  --mono:'Space Mono',ui-monospace,monospace;
  --disp:'Bebas Neue',impact,sans-serif;
  --logo:'Vampiro One',cursive;
  --body:'Klee One',system-ui,sans-serif;
  --a:#c0a6ff;
}
body{background:var(--plum);color:var(--lav);font-family:var(--body);text-align:left;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(780px 560px at 16% 4%, color-mix(in srgb,var(--a) 16%,transparent), transparent 62%),
    radial-gradient(640px 480px at 96% 106%, rgba(255,45,149,.07), transparent 60%),
    linear-gradient(180deg,#0d001a,#0b0b0e 55%,#0d001a)}
.bg:after{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px)}
/* the lit corner where star answers — the chat bubble lands on top of this */
.corner{position:fixed;right:-40px;bottom:-46px;width:210px;height:210px;z-index:0;pointer-events:none;
  border-radius:50%;background:radial-gradient(circle at 66% 68%, color-mix(in srgb,var(--a) 20%,transparent), transparent 66%)}
.corner:after{content:"";position:absolute;inset:34px;border-radius:50%;
  border:1px dashed color-mix(in srgb,var(--a) 26%,transparent);opacity:.5}
.stage{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:22px 14px 120px;
  display:flex;flex-direction:column;gap:14px}
.marquee{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{display:block;font-family:var(--logo);font-size:27px;letter-spacing:.05em;color:var(--a);
  text-shadow:0 0 16px color-mix(in srgb,var(--a) 42%,transparent)}
.tag{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin-top:4px}
.back{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--violet2);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;white-space:nowrap}
.back:hover{color:var(--lime);border-bottom-color:currentColor}

.scene{display:grid;grid-template-columns:236px 1fr;gap:14px;align-items:start;cursor:pointer;
  border:1px solid var(--line);border-radius:16px;padding:14px;
  background:linear-gradient(165deg,rgba(27,0,44,.55),rgba(11,11,14,.82));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 60px rgba(0,0,0,.5)}
.scene:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.portrait{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 28px color-mix(in srgb,var(--a) 22%,transparent);
  animation:fadein .9s ease both}
.portrait img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center 22%}
.portrait:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 46%,rgba(11,11,14,.74)),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px)}
.portrait figcaption{position:absolute;left:9px;right:9px;bottom:8px;z-index:2;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--a)}

.dialog{display:flex;flex-direction:column;gap:9px;min-height:236px;padding:13px 14px;border-radius:12px;
  background:rgba(10,0,20,.55);border:1px solid color-mix(in srgb,var(--a) 30%,transparent);backdrop-filter:blur(6px)}
.dialog .who{font-family:var(--disp);font-size:16px;letter-spacing:.10em;color:var(--a)}
.dialog .txt{font-size:15.5px;line-height:1.68;color:var(--lav);white-space:pre-wrap}
.dialog .txt.room{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);text-align:center;align-self:center;max-width:94%}
.dialog .txt.receipt{font-family:var(--mono);font-size:10.5px;line-height:1.95;letter-spacing:.01em;
  color:var(--lav);white-space:pre;overflow-x:auto}
.caret{display:inline-block;width:7px;height:14px;background:var(--a);vertical-align:-2px;
  margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.hint{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.links{display:flex;flex-wrap:wrap;gap:9px}
.links a{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;
  color:var(--lav);border:1px solid color-mix(in srgb,var(--a) 42%,transparent);border-radius:999px;
  padding:8px 13px;transition:.18s}
.links a:hover{border-color:var(--a);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--a) 30%,transparent)}
.links a.ghost{border-color:var(--line);color:var(--dim)}
.links a.ghost:hover{color:var(--violet2);border-color:currentColor;box-shadow:none}
#choices a{border-color:color-mix(in srgb,var(--a) 55%,transparent);color:#fff}
#choices a:hover{background:color-mix(in srgb,var(--a) 14%,transparent)}

.foot{font-family:var(--mono);font-size:9px;letter-spacing:.1em;line-height:1.95;color:var(--dim);text-align:center;padding-top:4px}
.foot a{color:var(--violet2);text-decoration:none}
.foot a:hover{color:var(--lime)}
.wipe{text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;padding-top:2px}
.wipe a{color:var(--dim);text-decoration:none;border-bottom:1px dotted color-mix(in srgb,var(--dim) 60%,transparent);padding-bottom:2px}
.wipe a:hover{color:var(--violet2);border-bottom-color:currentColor}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:680px){
  .scene{grid-template-columns:1fr;padding:12px}
  .portrait{width:186px;margin:0 auto}
  .dialog{min-height:216px}
  .brand{font-size:23px}
  .stage{padding-bottom:150px}
}
@media (prefers-reduced-motion:reduce){
  .portrait,.hint,.caret{animation:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="stage">
  <header class="marquee">

    <figure class="portrait">
      <img id="shot" alt="star, purple under-lights, holding a cup of coffee"
        src="https://user.uploads.dev/file/b0fc319bb972fced38dccaf0d74d5c2b.jpg">

    </figure>

  </div>

  <div class="wipe"><a href="#" id="wipeBtn">start over &middot; forget you were here</a></div>
</main>

<script src="https://slashpage.com/public/domain-chatbot.js" data-slashpage-domain="cafedreamr-members" data-slashpage-title="star-neko" defer></script>
<script src="https://www.cafedreamr.art/PASSPORT/cd-passport.js"></script>
<script>
/* ============================================================
   star &mdash; the front of the cafe                STAR/index.html
   The host's own page, and the counter itself: her portrait, and an
   order line you can actually use &mdash; pick a drink, a tea or
   something from the case, answer her questions, get a receipt. Her
   prices come from her original hand-made order line (starscafe.html).
   She is reserved with everyone at first; each order you complete
   hands over one more small piece of her. Nothing here is gated, and
   nothing is asked of the visitor: the page stands on its own.
   ============================================================ */
(function () {
  "use strict";

  /* ---------- the menu, out of her own original order line ----------
     prices are lifted from the hand-made `starscafe.html` order bot, so
     the counter quotes what it always quoted. `1` = she asks hot/iced. */
  var MENU = [
    { label: "coffee", say: "coffee, then \u2014 which one?", items: [
      ["house coffee", 3.00, 1],
      ["caf\u00e9 au lait", 4.00, 1],
      ["latte", 4.50, 1],
      ["pour-over", 4.25, 1],
      ["cold brew", 4.50, 1]
    ]},
    { label: "tea", say: "tea. which one?", items: [
      ["earl grey", 4.00, 1],
      ["matcha", 4.50, 1],
      ["chai latte", 4.75, 1],
      ["green tea", 3.50, 1]
    ]},
    { label: "the case", say: "the case is fresh this morning. which one?", items: [
      ["croissant", 3.50, 0],
      ["blueberry scone", 3.25, 0],
      ["cinnamon roll", 3.75, 0],
      ["glazed donut", 2.50, 0]
    ]}
  ];
  var RULE = "  " + new Array(28).join("-");
  var AFTER = ["added. anything else?", "noted. anything else?", "that's on the ticket. anything else?"];

  function money(n) { return "$" + n.toFixed(2); }

  function menuText() {
    var out = ["  the counter \u00b7 cafedreamr", RULE];
    MENU.forEach(function (cat, ci) {
      if (ci) out.push(RULE);
      cat.items.forEach(function (it) {
        out.push("  " + String(it[0]).padEnd(22, " ") + money(it[1]));
      });
    });
    out.push(RULE);
    out.push("  the espresso machine is not on the list.");
    out.push("  it has opinions about that.");
    return out.join("\n");
  }

  /* every order you sit through buys you one more piece of her. */
  var REVEALS = [
    [ { who: "star", say: "i'll bring it over when it's ready. sit anywhere." },
      { room: "she does not ask your name. she writes it on the cup only after you say it, and she never asks twice." } ],
    [ { who: "star", say: "i'll bring it over." },
      { who: "star", say: "while you wait \u2014 i keep this place. the books, the hours, and the keys to most of the doors. that's the part you get today." },
      { room: "she does not say which doors." } ],
    [ { who: "star", say: "i'll bring it over." },
      { who: "star", say: "you've been calling me star. that's right. it just isn't all of it." },
      { who: "star", say: "star-neko \u2014 that's the whole of it. neko is cat, in japanese. people hear that and decide i must be keeping one in the back room. i'm not." },
      { room: "she watches your face while you decide what to do with it." } ],
    [ { who: "star", say: "i'll bring it over." },
      { room: "she looks at you a while before she says anything. she does that." },
      { who: "star", say: "japanese on one side of the family, german on the other. that's where the name came from." },
      { room: "she stops there, on purpose, the way a door is closed." },
      { who: "star", say: "i'm quiet. it isn't a mood, and it isn't about you." } ],
    [ { who: "star", say: "i'll bring it over." },
      { who: "star", say: "there's a cat who lives here who isn't mine \u2014 misha. she's milo's. she's supposed to be out in his garden, and she isn't, because it's warmer in here, and because she's decided my chair is hers." },
      { room: "she says my chair with a completely straight face, and you realise a beat late that it was a joke." },
      { who: "star", say: "that's the whole of it. what i keep, i keep \u2014 you've had the rest." } ]
  ];

  var VISIT_KEY = "cd_met_star";
  var COUNT_KEY = "cd_star_visits";
  var MAXT = REVEALS.length - 1;
  var visits = 0;
  try {
    visits = parseInt(window.localStorage.getItem(COUNT_KEY), 10);
    if (!(visits >= 0)) visits = 0;
  } catch (e) {}

  var LINKS = [
    { href: "https://www.cafedreamr.art/", text: "back to the terminal \u2192", main: true },
    { href: "https://www.cafedreamr.art/MIKI/", text: "the coffee \u00b7 miki" },
    { href: "https://www.cafedreamr.art/HANS/", text: "the tea \u00b7 hans" },
    { href: "https://www.cafedreamr.art/LORE/MAP.html", text: "the realm map" },
    { href: "#", text: "order again", again: true }
  ];

  var scene = document.getElementById("scene"),
      whoEl = document.getElementById("who"),
      txtEl = document.getElementById("txt"),
      caretEl = document.getElementById("caret"),
      hintEl = document.getElementById("hint"),
      choicesEl = document.getElementById("choices"),
      linksEl = document.getElementById("links");

  var typing = false, ended = false, counted = false, timer = null, full = "",
      onTyped = null, pendingNext = null, order = [];
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}

  function paintLinks() {
    LINKS.forEach(function (l) {
      var a = document.createElement("a");
      a.textContent = l.text;
      if (l.again) {
        a.href = "#";
        a.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); restart(); });
      } else {
        a.href = l.href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      if (!l.main) a.className = "ghost";
      linksEl.appendChild(a);
    });
  }

  function paintChoices(list) {
    choicesEl.innerHTML = "";
    list.forEach(function (c) {
      var a = document.createElement("a");
      a.href = "#";
      a.textContent = c.t;
      if (!c.main) a.className = "ghost";
      a.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        choicesEl.hidden = true;
        linksEl.hidden = true;
        c.go();
      });
      choicesEl.appendChild(a);
    });
    choicesEl.hidden = false;
  }

  function restart() {
    order = []; ended = false;
    linksEl.hidden = true; choicesEl.hidden = true;
    openOrder("what can i get you?");
  }

  /* ---------- the order line: nodes, choices, and the receipt ------- */
  function ready(n) {
    caretEl.hidden = true;
    if (n.choices) { paintChoices(n.choices); }
    else if (n.next) { hintEl.hidden = false; }
    else { end(); }
  }

  function render(n) {
    pendingNext = (typeof n.next === "function") ? n.next : null;
    choicesEl.hidden = true; choicesEl.innerHTML = "";
    hintEl.hidden = true;
    if (n.room) {
      whoEl.hidden = true; txtEl.className = "txt room";
      type(n.room, function () { ready(n); });
    } else if (n.receipt) {
      whoEl.hidden = true; txtEl.className = "txt receipt";
      type(n.receipt, function () { ready(n); });
    } else if (n.say) {
      whoEl.hidden = false; whoEl.textContent = n.who || "star"; txtEl.className = "txt";
      type(n.say, function () { ready(n); });
    } else {
      ready(n);
    }
  }

  /* a run of narration that ends in a callback (tap through each line) */
  function playSeq(seq, done) {
    var k = 0;
    function step() {
      if (k >= seq.length) { done(); return; }
      var s = seq[k++];
      render({ who: s.who, room: s.room, say: s.say, receipt: s.receipt, next: step });
    }
    step();
  }

  function openChoices() {
    return [
      { t: "coffee", go: function () { showCat(0); } },
      { t: "tea", go: function () { showCat(1); } },
      { t: "something from the case", go: function () { showCat(2); } },
      { t: "the menu, first", go: function () { render({ receipt: menuText(), next: openOrder }); } }
    ];
  }

  /* line === null keeps her question on screen and just lays out the
     choices beneath it (used when the intro has already asked). */
  function openOrder(line) {
    var ch = openChoices();
    if (line === null) render({ choices: ch });
    else render({ who: "star", say: line || "what can i get you?", choices: ch });
  }

  function showCat(i) {
    var cat = MENU[i];
    var ch = cat.items.map(function (it, j) {
      return { t: it[0] + " \u00b7 " + money(it[1]), go: function () { chooseItem(i, j); } };
    });
    ch.push({ t: "something else", go: openOrder });
    render({ who: "star", say: cat.say, choices: ch });
  }

  function chooseItem(i, j) {
    var it = MENU[i].items[j];
    if (it[2]) {
      render({ who: "star", say: "hot, or iced?", choices: [
        { t: "hot", go: function () { addItem(it, "hot"); } },
        { t: "iced", go: function () { addItem(it, "iced"); } }
      ]});
    } else {
      addItem(it, "");
    }
  }

  function addItem(it, temp) {
    order.push({ name: it[0] + (temp ? ", " + temp : ""), price: it[1] });
    render({ who: "star", say: AFTER[(order.length - 1) % AFTER.length], choices: [
      { t: "coffee", go: function () { showCat(0); } },
      { t: "tea", go: function () { showCat(1); } },
      { t: "the case", go: function () { showCat(2); } },
      { t: "that's all", go: checkout }
    ]});
  }

  function checkout() {
    render({ who: "star", say: "for here, or to go?", choices: [
      { t: "for here", go: function () { showReceipt("for here"); } },
      { t: "to go", go: function () { showReceipt("to go"); } }
    ]});
  }

  function receiptText(where) {
    var out = ["  the counter \u00b7 cafedreamr", RULE];
    var sub = 0;
    order.forEach(function (o) {
      out.push("  " + String(o.name).padEnd(22, " ") + money(o.price));
      sub += o.price;
    });
    out.push(RULE);
    out.push("  " + "total".padEnd(22, " ") + money(sub));
    out.push("  " + "tax".padEnd(22, " ") + "on the house");
    out.push("  " + where);
    return out.join("\n");
  }

  function showReceipt(where) {
    render({ receipt: receiptText(where), next: function () {
      playSeq(REVEALS[Math.min(visits, MAXT)], end);
    }});
  }

  function type(text, done) {
    full = text;
    onTyped = done;
    typing = true;
    txtEl.textContent = "";
    caretEl.hidden = false;
    if (REDUCE) { typing = false; txtEl.textContent = text; done(); return; }
    var k = 0;
    function step() {
      if (!typing) return;
      k++;
      txtEl.textContent = full.slice(0, k);
      if (k >= full.length) {
        typing = false;
        caretEl.hidden = true;
        var f = onTyped; onTyped = null;
        if (f) f();
        return;
      }
      timer = setTimeout(step, 17 + Math.random() * 20);
    }
    timer = setTimeout(step, 130);
  }

  function finish() {
    if (!typing) return false;
    typing = false;
    clearTimeout(timer);
    txtEl.textContent = full;
    caretEl.hidden = true;
    var f = onTyped; onTyped = null;
    if (f) f();
    return true;
  }

  function end() {
    if (ended) return;
    ended = true;
    if (!counted) {
      counted = true;
      try {
        window.localStorage.setItem(VISIT_KEY, "1");
        window.localStorage.setItem(COUNT_KEY, String(visits + 1));
      } catch (e) {}
    }
    hintEl.hidden = true;
    choicesEl.hidden = true;
    linksEl.hidden = false;
  }

  function advance() {
    if (finish()) return;
    if (pendingNext) { var f = pendingNext; pendingNext = null; f(); }
  }

  paintLinks();
  scene.addEventListener("click", advance);
  scene.addEventListener("keydown", function (e) {
    if (e.target !== scene) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); advance(); }
  });

  /* first meeting: the whole short introduction. a return visit gets her
     two-word hello and goes straight to the counter. */
  function begin() {
    order = []; ended = false; counted = false;
    linksEl.hidden = true; choicesEl.hidden = true;
    var intro = visits > 0
      ? [ { who: "star", say: "back." } ]
      : [ { who: "star", say: "well \u2014 hi there. i run the caf\u00e9 here. i'm star." },
          { room: "she looks at you a moment longer than you were expecting, and she does not look away first." },
          { who: "star", say: "how can i help you? what brings you to the caf\u00e9?" } ];
    playSeq(intro, function () { openOrder(visits > 0 ? "what can i get you?" : null); });
  }

  /* the little link at the foot — forget that the counter remembered you */
  var wipeBtn = document.getElementById("wipeBtn");
  if (wipeBtn) {
    wipeBtn.addEventListener("click", function (e) {
      e.preventDefault();
      visits = 0;
      try {
        window.localStorage.removeItem(COUNT_KEY);
        window.localStorage.removeItem(VISIT_KEY);
      } catch (err) {}
      begin();
      try { scene.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (err) { window.scrollTo(0, 0); }
    });
  }

  begin();

  if (window.CD) { try { CD.boot({ page: "star" }); } catch (e) {} }
})();
</script>
</body>
</html>
