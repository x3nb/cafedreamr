<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#0d001a">
<title>star &middot; cafedreamr</title>
<meta name="description" content="Star keeps the cafe: the books, the hours, and the keys to most of the doors. Her name is star-neko &mdash; neko is cat, in japanese &mdash; and the window in the corner answers in her own voice.">
<meta property="og:title" content="star &middot; cafedreamr">
<meta property="og:description" content="The front of the cafe. Star keeps the books, the hours, and the keys.">
<meta property="og:image" content="https://user.uploads.dev/file/b0fc319bb972fced38dccaf0d74d5c2b.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230d001a'/%3E%3Cpath d='M8 2.4l1.5 3.4 3.7.3-2.8 2.4.85 3.6L8 10.2l-3.25 1.9.85-3.6L2.8 6.1l3.7-.3z' fill='%23c0a6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Klee+One:wght@400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Vampiro+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --plum:#0d001a; --ink:#0b0b0e; --ink2:#141419; --ink3:#1b1b22;
  --lime:#ccff00; --pink:#ff2d95; --cyan:#00e5ff;
  --violet:#bf40bf; --violet2:#ee82ee; --corn:#6495ed; --mint:#98fb98;
  --cream:#e9e6de; --lav:#fff0f5; --dim:#7d848b;
  --line:rgba(255,255,255,.10);
  --mono:'Space Mono',ui-monospace,monospace;
  --disp:'Bebas Neue',impact,sans-serif;
  --logo:'Vampiro One',cursive;
  --body:'Klee One',system-ui,sans-serif;
  --a:#c0a6ff;
}
body{background:var(--plum);color:var(--lav);font-family:var(--body);text-align:left;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(780px 560px at 16% 4%, color-mix(in srgb,var(--a) 16%,transparent), transparent 62%),
    radial-gradient(640px 480px at 96% 106%, rgba(255,45,149,.07), transparent 60%),
    linear-gradient(180deg,#0d001a,#0b0b0e 55%,#0d001a)}
.bg:after{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px)}
/* the lit corner where star answers — the chat bubble lands on top of this */
.corner{position:fixed;right:-40px;bottom:-46px;width:210px;height:210px;z-index:0;pointer-events:none;
  border-radius:50%;background:radial-gradient(circle at 66% 68%, color-mix(in srgb,var(--a) 20%,transparent), transparent 66%)}
.corner:after{content:"";position:absolute;inset:34px;border-radius:50%;
  border:1px dashed color-mix(in srgb,var(--a) 26%,transparent);opacity:.5}
.stage{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:22px 14px 120px;
  display:flex;flex-direction:column;gap:14px}
.marquee{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{display:block;font-family:var(--logo);font-size:27px;letter-spacing:.05em;color:var(--a);
  text-shadow:0 0 16px color-mix(in srgb,var(--a) 42%,transparent)}
.tag{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin-top:4px}
.back{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--violet2);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;white-space:nowrap}
.back:hover{color:var(--lime);border-bottom-color:currentColor}

.scene{display:grid;grid-template-columns:236px 1fr;gap:14px;align-items:start;cursor:pointer;
  border:1px solid var(--line);border-radius:16px;padding:14px;
  background:linear-gradient(165deg,rgba(27,0,44,.55),rgba(11,11,14,.82));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 60px rgba(0,0,0,.5)}
.scene:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.portrait{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 28px color-mix(in srgb,var(--a) 22%,transparent);
  animation:fadein .9s ease both}
.portrait img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center 22%}
.portrait:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 46%,rgba(11,11,14,.74)),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px)}
.portrait figcaption{position:absolute;left:9px;right:9px;bottom:8px;z-index:2;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--a)}

.dialog{display:flex;flex-direction:column;gap:9px;min-height:236px;padding:13px 14px;border-radius:12px;
  background:rgba(10,0,20,.55);border:1px solid color-mix(in srgb,var(--a) 30%,transparent);backdrop-filter:blur(6px)}
.dialog .who{font-family:var(--disp);font-size:16px;letter-spacing:.10em;color:var(--a)}
.dialog .txt{font-size:15.5px;line-height:1.68;color:var(--lav);white-space:pre-wrap}
.dialog .txt.room{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);text-align:center;align-self:center;max-width:94%}
.caret{display:inline-block;width:7px;height:14px;background:var(--a);vertical-align:-2px;
  margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.hint{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.links{display:flex;flex-wrap:wrap;gap:9px}
.links a{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;
  color:var(--lav);border:1px solid color-mix(in srgb,var(--a) 42%,transparent);border-radius:999px;
  padding:8px 13px;transition:.18s}
.links a:hover{border-color:var(--a);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--a) 30%,transparent)}
.links a.ghost{border-color:var(--line);color:var(--dim)}
.links a.ghost:hover{color:var(--violet2);border-color:currentColor;box-shadow:none}

.foot{font-family:var(--mono);font-size:9px;letter-spacing:.1em;line-height:1.95;color:var(--dim);text-align:center;padding-top:4px}
.foot a{color:var(--violet2);text-decoration:none}
.foot a:hover{color:var(--lime)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:680px){
  .scene{grid-template-columns:1fr;padding:12px}
  .portrait{width:186px;margin:0 auto}
  .dialog{min-height:216px}
  .brand{font-size:23px}
  .stage{padding-bottom:150px}
}
@media (prefers-reduced-motion:reduce){
  .portrait,.hint,.caret{animation:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="corner" aria-hidden="true"></div>

<main class="stage">
  <header class="marquee">
    <div>
      <span class="brand">star</span>
      <span class="tag">the front of the caf&eacute; &middot; CC-001</span>
    </div>
    <a class="back" href="https://www.cafedreamr.art/">&larr; the terminal</a>
  </header>

  <section class="scene" id="scene" role="button" tabindex="0" aria-label="continue the conversation">
    <figure class="portrait">
      <img id="shot" alt="star, purple under-lights, holding a cup of coffee"
        src="https://user.uploads.dev/file/b0fc319bb972fced38dccaf0d74d5c2b.jpg">
      <figcaption>star &middot; cafe owner &amp; literary navigator</figcaption>
    </figure>

    <div class="dialog">
      <div class="who" id="who">star</div>
      <div class="txt" id="txt"></div><span class="caret" id="caret" hidden></span>
      <div class="bottom">
        <div class="hint" id="hint" hidden>&#9656; tap to continue</div>
        <div class="links" id="links" hidden></div>
      </div>
    </div>
  </section>

  <div class="foot">
    <a href="https://www.cafedreamr.art/">the terminal</a> &middot;
    <a href="https://www.cafedreamr.art/LORE/MAP.html">the realm map</a> &middot;
    <a href="https://www.cafedreamr.art/LORE/HOURS/">the hours</a> &middot;
    <a href="https://www.cafedreamr.art/MIKI/">miki's place</a> &middot;
    <a href="https://www.cafedreamr.art/HANS/">the stacks</a> &middot;
    <a href="https://www.cafedreamr.art/PASSPORT/">your stamp card</a> &middot;
    <a href="https://www.cafedreamr.art/SUPPORT/">support the realm</a><br>
    &copy; cafedreamr &middot; the caf&eacute; is always open
  </div>
</main>

<script src="https://slashpage.com/public/domain-chatbot.js" data-slashpage-domain="cafedreamr-members" data-slashpage-title="star-neko" defer></script>
<script src="https://www.cafedreamr.art/PASSPORT/cd-passport.js"></script>
<script>
/* ============================================================
   star &mdash; the front of the cafe                STAR/index.html
   The host's own page: her portrait and one short conversation,
   plus star-neko's own chat bubble at the foot of the page
   (star-neko is star's name, not a pet's). Nothing here is gated
   and nothing is asked of the visitor: the page stands on its own.
   ============================================================ */
(function () {
  "use strict";

  var FIRST_LINES = [
    { who: "star", say: "oh — you came the long way, past the machine. good. i like the ones who read the whole front of the caf\u00e9 before they knock." },
    { who: "star", say: "i'm star. i keep this place — the books, the hours, and the keys to most of the doors. which door you get first is my decision, and i make it kindly." },
    { room: "she sets down a cup she was not drinking from, and turns the ledger a quarter turn, so you cannot read it." },
    { who: "star", say: "you have already met my face on the screen upstairs \u2014 that one is always mid-sip and never says anything. this is the quieter version, the one allowed to say more than \u201cwelcome back.\u201d" },
    { who: "star", say: "and since you were going to ask about the name \u2014 star-neko. neko is cat, in japanese. i'm a hybrid; one side of me is japanese and the other is german, and the name has been mine my whole life. it is not a pet's name, and i keep no pets." },
    { who: "star", say: "the only cat at this caf\u00e9 belongs to milo \u2014 misha. she is supposed to be out in his garden, and she almost never is, because it is warmer in here, and because she has decided that the purple chair is hers the moment i get up from it." },
    { who: "star", say: "so the thing that answers at the bottom right of this page is me too \u2014 the same me, sitting in a little window. tap it when you are ready. i like being asked." },
    { room: "somewhere behind you, the warm chair has already been taken by a cat who does not live here." }
  ];

  /* she says it once. come back and the ledger is still turned away. */
  var RETURN_LINE = { who: "star", say: "back. the machine is still humming and misha still has my chair. nothing has happened, so nothing is wrong. sit a moment, or ask me whatever you came to ask." };
  var VISIT_KEY = "cd_met_star";
  var been = false;
  try { been = window.localStorage.getItem(VISIT_KEY) === "1"; } catch (e) {}
  var LINES = been ? [RETURN_LINE] : FIRST_LINES;

  var LINKS = [
    { href: "https://www.cafedreamr.art/", text: "back to the terminal \u2192", main: true },
    { href: "https://www.cafedreamr.art/MIKI/", text: "the coffee \u00b7 miki" },
    { href: "https://www.cafedreamr.art/HANS/", text: "the tea \u00b7 hans" },
    { href: "https://www.cafedreamr.art/LORE/MAP.html", text: "the realm map" }
  ];

  if (been) LINKS.push({ href: "#", text: "hear it again", replay: true });

  var scene = document.getElementById("scene"),
      whoEl = document.getElementById("who"),
      txtEl = document.getElementById("txt"),
      caretEl = document.getElementById("caret"),
      hintEl = document.getElementById("hint"),
      linksEl = document.getElementById("links");

  var i = 0, typing = false, ended = false, timer = null, full = "", onTyped = null;
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) {}

  function paintLinks() {
    LINKS.forEach(function (l) {
      var a = document.createElement("a");
      a.textContent = l.text;
      if (l.replay) {
        a.href = "#";
        a.addEventListener("click", function (e) { e.preventDefault(); replay(); });
      } else {
        a.href = l.href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      if (!l.main) a.className = "ghost";
      linksEl.appendChild(a);
    });
  }

  function replay() {
    typing = false; clearTimeout(timer); caretEl.hidden = true;
    LINES = FIRST_LINES; i = 0; ended = false;
    linksEl.hidden = true;
    whoEl.hidden = false; whoEl.textContent = "star"; txtEl.className = "txt";
    hintEl.hidden = true;
    show();
  }

  function settle() { caretEl.hidden = true; hintEl.hidden = false; }

  function type(text, done) {
    full = text;
    onTyped = done;
    typing = true;
    txtEl.textContent = "";
    caretEl.hidden = false;
    if (REDUCE) { typing = false; txtEl.textContent = text; done(); return; }
    var k = 0;
    function step() {
      if (!typing) return;
      k++;
      txtEl.textContent = full.slice(0, k);
      if (k >= full.length) {
        typing = false;
        caretEl.hidden = true;
        var f = onTyped; onTyped = null;
        if (f) f();
        return;
      }
      timer = setTimeout(step, 17 + Math.random() * 20);
    }
    timer = setTimeout(step, 130);
  }

  function finish() {
    if (!typing) return false;
    typing = false;
    clearTimeout(timer);
    txtEl.textContent = full;
    caretEl.hidden = true;
    var f = onTyped; onTyped = null;
    if (f) f();
    return true;
  }

  function show() {
    var L = LINES[i++];
    hintEl.hidden = true;
    if (L.room) {
      whoEl.hidden = true;
      txtEl.className = "txt room";
      type(L.room, settle);
    } else {
      whoEl.hidden = false;
      whoEl.textContent = L.who || "star";
      txtEl.className = "txt";
      type(L.say, settle);
    }
  }

  function end() {
    if (ended) return;
    ended = true;
    try { window.localStorage.setItem(VISIT_KEY, "1"); } catch (e) {}
    hintEl.hidden = true;
    linksEl.hidden = false;
  }

  function advance() {
    if (finish()) return;
    if (i < LINES.length) show();
    else end();
  }

  paintLinks();
  scene.addEventListener("click", advance);
  scene.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); advance(); }
  });

  if (been) {
    whoEl.hidden = false; whoEl.textContent = "star"; txtEl.className = "txt";
    txtEl.textContent = RETURN_LINE.say;
    hintEl.hidden = true;
    end();
  } else {
    show();
  }

  if (window.CD) { try { CD.boot({ page: "star" }); } catch (e) {} }
})();
</script>
</body>
</html>
